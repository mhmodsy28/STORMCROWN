<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#05000f">
<title>تاج العاصفة — STORMCROWN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Amiri:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#05000f;color:#fff;
  font-family:'Amiri',serif;user-select:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{display:block}
#auth{position:fixed;inset:0;z-index:2000;
  background:radial-gradient(ellipse at 50% 100%,#3a0505 0%,#0a0014 45%,#000 100%);
  overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px}
#auth.fade{animation:iFade 1s ease forwards}
@keyframes iFade{to{opacity:0;visibility:hidden}}
.authWrap{position:relative;z-index:10;width:100%;max-width:440px;
  max-height:92vh;overflow-y:auto;padding:24px 24px 20px;
  background:linear-gradient(180deg,rgba(20,0,10,.96),rgba(5,0,15,.98));
  border:2px solid #6b0a0a;border-radius:14px;
  box-shadow:0 0 60px rgba(139,0,0,.7),0 20px 60px rgba(0,0,0,.95)}
.authTitle{text-align:center;margin-bottom:6px;font-family:'Cinzel Decorative',serif;
  font-size:clamp(24px,6vw,36px);font-weight:900;
  background:linear-gradient(180deg,#ff2a00,#8b0000,#4a0000);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,42,0,.8))}
.authSub{text-align:center;font-size:12px;color:#8a5050;letter-spacing:.25em;margin-bottom:18px}
.authField{margin-bottom:10px}
.authField label{display:block;font-size:11px;color:#a07070;margin-bottom:4px}
.authField input{width:100%;padding:10px 12px;background:rgba(10,0,5,.9);
  border:1px solid #4a0a0a;border-radius:6px;color:#ffd0d0;
  font-family:'Amiri',serif;font-size:14px}
.authField input:focus{outline:none;border-color:#ff2a00;box-shadow:0 0 20px rgba(255,42,0,.5)}
.authBtn{width:100%;padding:12px;margin-top:6px;font-family:'Cinzel Decorative',serif;
  font-size:14px;font-weight:700;letter-spacing:.1em;border:2px solid #ff2a00;
  border-radius:8px;background:linear-gradient(180deg,#6b0a0a,#1a0000);
  color:#ffd0d0;cursor:pointer;transition:all .2s}
.authBtn:hover{background:linear-gradient(180deg,#a01010,#3a0000);color:#fff}
.authBtn.secondary{background:linear-gradient(180deg,#1a0a2a,#0a0215);
  border-color:#6a0dad;color:#d0b0ff}
.authSwitch{text-align:center;margin-top:10px;font-size:12px;color:#a07070}
.authSwitch span{color:#ff2a00;cursor:pointer;font-weight:700;
  text-decoration:underline;margin-right:4px}
.authErr{margin-top:10px;padding:8px 10px;background:rgba(139,0,0,.2);
  border:1px solid #6b0a0a;border-radius:6px;color:#ff8080;
  font-size:12px;text-align:center;display:none}
.authErr.on{display:block}
#game{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity 1s;
  z-index:5;display:none;flex-direction:column;overflow:hidden;
  width:100vw;height:100vh;height:100dvh;
  background:
    radial-gradient(ellipse at 50% 0%,#3a1568 0%,transparent 50%),
    radial-gradient(ellipse at 50% 100%,#4a1550 0%,transparent 60%),
    radial-gradient(ellipse at 50% 50%,#1a0533 0%,#0a0218 60%,#05000a 100%)}
#game.on{opacity:1;visibility:visible;display:flex}
#flash{position:fixed;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}
#topBtns{position:fixed;top:6px;left:0;right:0;z-index:60;height:80px;
  display:none;pointer-events:none}
#topBtns.on{display:block}
#topBtns button{pointer-events:auto;position:absolute;border-radius:50%;
  width:36px;height:36px;font-size:15px;border:2px solid;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;padding:0;line-height:1}
#topBtns button:active{transform:scale(.9)}
#soundBtn{top:0;right:6px;background:rgba(30,10,60,.9);border-color:#6a4a9a;color:#ffd24a}
#profileBtn{top:0;left:6px;background:rgba(60,20,120,.95);border-color:#ffd24a;color:#ffd24a}
#walletBtn{top:0;left:48px;background:rgba(30,90,60,.95);border-color:#2ecc71;color:#2ecc71}
#agentBadge{top:42px;left:6px;background:rgba(60,30,110,.95);border-color:#9b59ff;color:#c89bff}
#logoutTopBtn{top:42px;left:48px;background:rgba(139,0,0,.95);border-color:#ff2a00;color:#ff8080}
#mainArea{display:flex;flex-direction:column;width:100%;height:100%;
  padding:46px 4px 4px 4px;gap:4px;overflow:hidden}
#hud{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;
  width:100%;flex-shrink:0}
.hudBox{background:linear-gradient(180deg,rgba(60,30,110,.85),rgba(15,5,40,.9));
  border:1px solid rgba(155,89,255,.6);padding:3px 8px;border-radius:5px;
  font-size:9px;color:#c8b0e8;white-space:nowrap}
.hudBox b{color:#ffd24a;font-family:monospace;font-size:11px;margin-right:2px}
.hudBox.hot{border-color:#ff8c00;box-shadow:0 0 15px #ff8c00}
#playRow{display:flex;gap:4px;flex:1;min-height:0;width:100%;
  align-items:center;justify-content:center;overflow:hidden}
#sideCol{display:flex;flex-direction:column;gap:4px;width:78px;
  height:100%;max-height:100%;overflow:hidden;flex-shrink:0}
#paytable,#historyPanel{background:linear-gradient(180deg,rgba(40,15,80,.9),rgba(10,3,25,.95));
  border:1px solid rgba(106,74,154,.6);border-radius:6px;padding:4px;
  overflow:hidden;display:flex;flex-direction:column;min-height:0}
#paytable{flex-shrink:0}
#historyPanel{flex:1;min-height:0}
#paytable h3,#historyPanel h3{font-size:8px;color:#ffd24a;text-align:center;
  border-bottom:1px solid rgba(106,74,154,.4);padding-bottom:2px;margin-bottom:3px;flex-shrink:0}
.ptRow{display:flex;justify-content:space-between;align-items:center;
  padding:1px 2px;font-family:monospace;font-size:8px}
.ptRow .ico{width:14px;height:14px}
.ptRow .ico canvas{width:100%;height:100%}
.ptRow .val{color:#ffd24a;font-size:8px;font-weight:bold}
#historyList{flex:1;overflow-y:auto;font-family:monospace;font-size:8px;min-height:0}
.histRow{display:grid;grid-template-columns:18px 1fr 1fr;gap:1px;padding:1px 2px;
  border-radius:2px;margin-bottom:1px;background:rgba(255,255,255,.03);
  border-left:2px solid transparent}
.histRow.win{background:rgba(46,204,113,.12);border-left-color:#2ecc71}
.histRow.loss{background:rgba(255,42,42,.08);border-left-color:#ff4a4a}
.histRow.zero{opacity:.6;border-left-color:#666}
.histRow .hs{color:#888}.histRow .hb{color:#ffd24a}.histRow .hn{font-weight:bold}
.histRow.win .hn{color:#2ecc71}.histRow.loss .hn{color:#ff6a6a}
#frameWrap{flex:1;display:flex;align-items:center;justify-content:center;
  min-width:0;min-height:0;padding:0;overflow:hidden}
#frame{position:relative;padding:4px;border-radius:10px;
  background:linear-gradient(135deg,#3a1568,#1a0533,#4a1a7a,#1a0533,#3a1568);
  box-shadow:0 0 30px rgba(106,74,154,.5),inset 0 0 20px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  max-width:100%;max-height:100%}
#frame.fire{box-shadow:0 0 50px #ff8c00,inset 0 0 25px rgba(255,140,0,.3)}
#reels{border-radius:5px;display:block;
  max-width:100%;max-height:100%;
  width:auto;height:auto;object-fit:contain}
#zeusBackdrop{position:absolute;top:4px;left:4px;border-radius:5px;
  pointer-events:none;z-index:1;
  max-width:100%;max-height:100%;width:auto;height:auto}
#ctrl{display:flex;gap:3px;align-items:center;justify-content:center;
  flex-shrink:0;flex-wrap:wrap;width:100%;padding:2px 0}
.cbtn{padding:5px 8px;font-family:'Amiri',serif;font-size:10px;font-weight:700;
  border:1px solid rgba(155,89,255,.6);border-radius:5px;
  background:linear-gradient(180deg,rgba(60,30,110,.9),rgba(15,5,40,.9));
  color:#e0d0ff;cursor:pointer;white-space:nowrap}
.cbtn:disabled{opacity:.4}
#betBox{background:rgba(15,5,40,.95);border:1px solid rgba(155,89,255,.6);
  padding:3px 8px;border-radius:5px;min-width:70px;text-align:center}
#betBox small{display:block;font-size:8px;color:#a090d0}
#betBox b{color:#ffd24a;font-family:monospace;font-size:11px}
#spinWrap{width:58px;height:58px;flex-shrink:0}
#spinWheel{width:58px;height:58px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 50% 30%,#fff8e0,#ffd24a 30%,#ff8c00 55%,#8b4000 80%,#4a0a0a);
  border:2px solid #ffd24a;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(255,140,0,.6),inset 0 -4px 12px rgba(0,0,0,.5),
    inset 0 4px 12px rgba(255,255,255,.3);transition:transform .15s}
#spinWheel:active:not(.disabled){transform:scale(.94)}
#spinWheel.disabled{filter:grayscale(.7) brightness(.5);opacity:.6}
#spinWheel.spinning{animation:wheelSpin .4s linear infinite}
@keyframes wheelSpin{to{transform:rotate(360deg)}}
#spinLabel{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:11px;
  color:#3a0500;text-shadow:0 0 6px rgba(255,255,255,.8);position:relative;z-index:2}
.bonusBtn{padding:5px 7px;font-family:'Amiri',serif;font-size:9px;font-weight:700;
  border-radius:6px;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0}
.bonusBtn small{font-size:7px;font-family:monospace;opacity:.85}
.bonusBtn .price{font-family:monospace;font-size:9px;font-weight:bold}
#buyNormal{background:linear-gradient(180deg,#1a5a2a,#0a3015);
  border:2px solid #2ecc71;color:#d0ffe0}
#buyPremium{background:linear-gradient(180deg,#6a1a5a,#3a0540);
  border:2px solid #ffd24a;color:#ffe8a0}
#log{height:26px;overflow-y:auto;width:100%;font-size:8px;
  background:rgba(5,0,20,.85);padding:2px 6px;border-radius:4px;
  border:1px solid rgba(106,74,154,.35);color:#a090c0;flex-shrink:0}
#log b{color:#ffd24a}
.big{position:fixed;top:50%;left:50%;z-index:40;pointer-events:none;
  transform:translate(-50%,-50%) scale(.3);opacity:0;text-align:center;
  font-family:'Cinzel Decorative',serif;font-size:clamp(40px,9vw,90px);font-weight:900;
  background:linear-gradient(180deg,#fff,#ffd24a 40%,#ff8c00 70%,#b8860b);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(255,210,74,.7))}
#fsBanner{position:fixed;top:0;left:0;right:0;z-index:25;padding:6px;
  text-align:center;font-family:'Amiri',serif;font-weight:700;font-size:12px;color:#fff;
  background:linear-gradient(180deg,rgba(255,140,0,.5),transparent);
  border-bottom:2px solid #ff8c00;opacity:0;transform:translateY(-100%);
  transition:all .7s;pointer-events:none}
#fsBanner.on{opacity:1;transform:translateY(0)}
.mpop{position:fixed;z-index:36;font-family:'Cinzel Decorative',serif;
  font-size:24px;font-weight:900;pointer-events:none;
  background:linear-gradient(180deg,#fff,#c89bff,#9b59ff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 15px #9b59ff);animation:mpop 1.3s ease-out forwards}
@keyframes mpop{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  20%{transform:translate(-50%,-50%) scale(1.3);opacity:1}
  40%{transform:translate(-50%,-50%) scale(1)}
  100%{transform:translate(-50%,-180%) scale(.9);opacity:0}}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);
  display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);
  padding:12px;overflow-y:auto}
.modal.on{display:flex}
.modalCard{background:linear-gradient(180deg,rgba(40,15,80,.96),rgba(10,3,25,.98));
  border:2px solid #ffd24a;border-radius:14px;padding:16px;
  max-width:min(95vw,560px);width:100%;max-height:92vh;overflow-y:auto;position:relative}
.modalCard h2{color:#ffd24a;font-size:18px;text-align:center;margin-bottom:12px;
  text-shadow:0 0 15px #ff8c00}
.closeX{position:absolute;top:6px;left:6px;background:none;border:none;
  color:#ff4a4a;font-size:20px;cursor:pointer;padding:4px 8px}
.walletTabs{display:flex;gap:5px;margin-bottom:12px;justify-content:center;flex-wrap:wrap}
.walletTab{padding:6px 12px;background:linear-gradient(180deg,#1a3a2a,#0a1a10);
  border:1px solid #2ecc71;border-radius:6px;color:#c8ffd8;
  cursor:pointer;font-size:11px;font-weight:bold}
.walletTab.active{background:linear-gradient(180deg,#2ecc71,#1a5a2a);color:#fff}
.walletPanel{display:none}
.walletPanel.active{display:block}
.walletField{margin-bottom:10px;text-align:right}
.walletField label{display:block;font-size:11px;color:#a0d0b0;margin-bottom:4px}
.walletField input,.walletField select{width:100%;padding:9px 11px;
  background:rgba(5,30,15,.9);border:1px solid #2ecc71;border-radius:6px;
  color:#c8ffd8;font-family:'Amiri',serif;font-size:13px;direction:ltr}
.walletField input:focus{outline:none;box-shadow:0 0 15px rgba(46,204,113,.6)}
.walletField .hint{font-size:10px;color:#5a8a6a;margin-top:3px;direction:rtl}
.walletBtn{width:100%;padding:10px;margin-top:8px;font-family:'Amiri',serif;
  font-size:13px;font-weight:700;border:2px solid #2ecc71;border-radius:6px;
  background:linear-gradient(180deg,#1a5a2a,#0a3015);color:#fff;cursor:pointer}
.walletBtn:hover{background:linear-gradient(180deg,#2ecc71,#1a5a2a)}
.walletBtn.secondary{background:linear-gradient(180deg,#2a2a4a,#1a1a30);
  border-color:#6a6a9a;color:#c8c8e8}
.walletInfo{background:rgba(46,204,113,.1);border:1px solid #2ecc71;border-radius:6px;
  padding:7px;margin-bottom:10px;font-size:11px;color:#c8ffd8;line-height:1.5}
.walletInfo b{color:#2ecc71;font-family:monospace;direction:ltr;display:inline-block}
.companyWallet{background:linear-gradient(180deg,#1a3a2a,#0a1a10);
  border:2px dashed #2ecc71;border-radius:8px;padding:12px 10px;margin:8px 0;
  cursor:pointer;text-align:center;transition:all .2s;user-select:none}
.companyWallet:active{background:#2ecc71;transform:scale(.98)}
.companyWallet .cw-label{font-size:11px;color:#a0d0b0;margin-bottom:6px;
  font-family:'Amiri',serif;direction:rtl;font-weight:bold}
.companyWallet .cw-address{font-family:monospace;font-size:12px;color:#fff;
  direction:ltr;word-break:break-all;font-weight:bold;line-height:1.4}
.companyWallet .cw-hint{font-size:10px;color:#7aab8a;margin-top:6px;
  direction:rtl;font-family:'Amiri',serif}
.historyItem{display:flex;justify-content:space-between;padding:6px 8px;
  background:rgba(46,204,113,.08);border-radius:5px;margin-bottom:3px;
  font-size:10px;font-family:monospace;color:#c8ffd8;direction:ltr;
  border-left:3px solid #2ecc71}
.historyItem.pending{border-left-color:#ffd24a}
.historyItem.rejected{border-left-color:#ff4a4a;opacity:.6}
.profileRow{display:flex;justify-content:space-between;padding:6px 9px;
  margin-bottom:5px;border-radius:5px;background:rgba(106,74,154,.15);
  border-right:3px solid #ffd24a;font-size:11px}
.profileRow .lbl{color:#a090d0}
.profileRow .val{color:#ffd24a;font-family:monospace;font-weight:bold;
  direction:ltr;text-align:left}
.profileUID{background:linear-gradient(180deg,#ffd24a,#ff8c00);color:#1a0033;
  padding:9px;border-radius:6px;text-align:center;font-family:monospace;
  font-size:14px;font-weight:900;letter-spacing:.06em;margin:9px 0;
  cursor:pointer;direction:ltr;word-break:break-all}
.profileUID small{display:block;font-size:10px;color:#4a2000;margin-bottom:3px;
  font-weight:normal;direction:rtl}
.agentBox{background:rgba(155,89,255,.1);border:1px solid #9b59ff;border-radius:6px;
  padding:9px;margin-bottom:10px;font-size:11px;color:#e0d0ff;line-height:1.6;text-align:right}
.agentBox b{color:#c89bff}
.agentLink{background:#0a0515;border-radius:5px;padding:7px;font-family:monospace;
  font-size:10px;word-break:break-all;color:#c89bff;cursor:pointer;margin:5px 0;
  direction:ltr;text-align:center}
.agentStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.agentStat{background:rgba(155,89,255,.1);border:1px solid #9b59ff;border-radius:6px;
  padding:7px;text-align:center;font-size:10px}
.agentStat .lbl{color:#888;margin-bottom:3px}
.agentStat .val{color:#c89bff;font-weight:bold;font-size:12px}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:linear-gradient(180deg,#2ecc71,#00a050);color:#fff;padding:10px 18px;
  border-radius:8px;font-weight:bold;z-index:9999;transition:transform .3s;
  font-size:12px;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:linear-gradient(180deg,#ff4a4a,#8b0000)}
#zeusBubble{position:fixed;bottom:130px;left:50%;
  transform:translate(-50%,30px) scale(.8);opacity:0;
  background:linear-gradient(180deg,rgba(40,15,80,.95),rgba(15,3,35,.98));
  border:2px solid #ffd24a;border-radius:12px;padding:8px 16px;
  font-family:'Amiri',serif;font-size:13px;color:#fff;
  box-shadow:0 0 30px #ff8c00;transition:all .4s;
  pointer-events:none;z-index:35;font-weight:700;max-width:85vw;text-align:center}
#bwOverlay{position:fixed;inset:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:12px;pointer-events:none}
#bwOverlay.show{display:flex;pointer-events:auto;animation:iFade .3s ease}
.bw-scrim{position:absolute;inset:0;background:rgba(0,0,0,.88)}
.bw-frame{position:relative;width:100%;max-width:480px;padding:16px;border-radius:14px;
  background:linear-gradient(180deg,#2a0a4a,#1a0230 40%,#3a1060 70%,#1a0230);
  box-shadow:0 0 60px rgba(255,210,74,.6);
  animation:bwIn .6s cubic-bezier(.19,1.6,.3,1)}
@keyframes bwIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}}
.bw-content{text-align:center;padding:12px}
.bw-title{font-family:'Cinzel Decorative',serif;font-size:clamp(24px,7vw,44px);
  font-weight:900;background:linear-gradient(180deg,#fff,#ffd24a,#ff8c00,#8b4000);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,210,74,.8))}
.bw-sub{font-size:12px;color:#e0d0ff;margin:4px 0 8px}
.bw-amount-wrap{display:inline-block;padding:10px 22px;margin:6px 0;border-radius:8px;
  background:linear-gradient(180deg,#1a3a8a,#0a1a4a,#1a3a8a);border:2px solid #ffd24a;
  box-shadow:0 0 25px rgba(255,210,74,.6)}
.bw-amount{font-family:monospace;font-size:clamp(24px,6vw,38px);font-weight:900;color:#fff;
  text-shadow:0 0 12px #ffd24a,0 0 24px #ff8c00}
.bw-currency{font-size:10px;color:#c8b0e8;letter-spacing:.1em}
.bw-fs{margin-top:10px;padding:5px 14px;display:inline-block;font-size:12px;
  font-weight:700;color:#fff;background:linear-gradient(180deg,#ff8c00,#c94000);
  border:2px solid #ffd24a;border-radius:6px}
.bw-tap{margin-top:10px;font-size:10px;color:#a090d0}
@media (max-width:640px){
  #mainArea{padding:44px 3px 3px 3px;gap:3px}
  #sideCol{width:64px;gap:3px}
  #paytable,#historyPanel{padding:3px}
  #paytable h3,#historyPanel h3{font-size:7px;padding-bottom:1px;margin-bottom:2px}
  .ptRow{font-size:7px;padding:0}
  .ptRow .ico{width:12px;height:12px}
  #historyList{font-size:7px}
  .histRow{grid-template-columns:16px 1fr 1fr;font-size:7px;padding:1px}
  #hud{gap:2px}
  .hudBox{padding:2px 6px;font-size:8px}
  .hudBox b{font-size:10px}
  #ctrl{gap:3px;padding:1px 0}
  .cbtn{padding:4px 6px;font-size:9px}
  #betBox{padding:2px 6px;min-width:60px}
  #betBox small{font-size:7px}
  #betBox b{font-size:10px}
  #spinWrap,#spinWheel{width:52px;height:52px}

<script>

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const sl=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= AUDIO ================= */
const Aud=(()=>{
  let c=null,mg=null,drone=null,on=true,rev=null,chimeTimer=null,ready=false;
  function init(){
    if(c)return;
    try{
      c=new (window.AudioContext||window.webkitAudioContext)();
      const comp=c.createDynamicsCompressor();
      comp.threshold.value=-10;comp.knee.value=6;comp.ratio.value=14;
      mg=c.createGain();mg.gain.value=.4;
      mg.connect(comp);comp.connect(c.destination);
      const len=c.sampleRate*3.2,imp=c.createBuffer(2,len,c.sampleRate);
      for(let ch=0;ch<2;ch++){const d=imp.getChannelData(ch);
        for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
      rev=c.createConvolver();rev.buffer=imp;
      const rg=c.createGain();rg.gain.value=.4;
      rev.connect(rg);rg.connect(mg);
      ready=true;
    }catch(e){}
  }
  function resume(){ if(!c)return; if(c.state==='suspended'){c.resume().catch(()=>{});} }
  function send(node,dry,wet){
    const d=c.createGain();d.gain.value=dry;node.connect(d);d.connect(mg);
    const w=c.createGain();w.gain.value=wet;node.connect(w);w.connect(rev);
  }
  function thunder(i=1){
    if(!on||!ready)return; resume();
    try{
      const sub=c.createOscillator();sub.type='sine';
      sub.frequency.setValueAtTime(80,c.currentTime);
      sub.frequency.exponentialRampToValueAtTime(25,c.currentTime+.7);
      const sg=c.createGain();sg.gain.setValueAtTime(.4*i,c.currentTime);
      sg.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.2);
      sub.connect(sg);sg.connect(mg);sub.start();sub.stop(c.currentTime+1.3);
      const dur=2.2;
      const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
      const d=buf.getChannelData(0);
      for(let k=0;k<d.length;k++){const t=k/d.length;
        d[k]=(Math.random()*2-1)*Math.exp(-t*2.8)*.55}
      const s=c.createBufferSource();s.buffer=buf;
      const lp=c.createBiquadFilter();lp.type='lowpass';
      lp.frequency.setValueAtTime(900,c.currentTime);
      lp.frequency.exponentialRampToValueAtTime(50,c.currentTime+1.8);
      const g=c.createGain();g.gain.value=.6*i;
      s.connect(lp);lp.connect(g);send(g,1,.5);s.start();
    }catch(e){}
  }
  function reelStop(col){
    if(!on||!ready)return; resume();
    try{
      const b=70+col*12;
      const o=c.createOscillator();o.type='triangle';
      o.frequency.setValueAtTime(b*4,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(b*.5,c.currentTime+.13);
      const g=c.createGain();g.gain.setValueAtTime(.4,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);
      o.connect(g);send(g,1,.3);o.start();o.stop(c.currentTime+.2);
    }catch(e){}
  }
  function reelSpin(col){
    if(!on||!ready)return; resume();
    try{
      const o=c.createOscillator();o.type='sawtooth';
      o.frequency.value=45+col*6;
      const g=c.createGain();g.gain.setValueAtTime(.03,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
      o.connect(lp);lp.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+.55);
    }catch(e){}
  }
  function mult(v){
    if(!on||!ready)return; resume();
    try{
      const b=280+Math.log2(v+1)*180;
      const o=c.createOscillator();o.type='triangle';
      o.frequency.setValueAtTime(b,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(b*2.8,c.currentTime+.2);
      const g=c.createGain();g.gain.setValueAtTime(.25,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4);
      o.connect(g);send(g,1,.4);o.start();o.stop(c.currentTime+.42);
    }catch(e){}
  }
  function win(p=1){
    if(!on||!ready)return; resume();
    try{
      [261.63,329.63,392,523.25,659.25].forEach((f,i)=>{
        const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f*p;
        const g=c.createGain();const t=c.currentTime+i*.05;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.03);
        g.gain.exponentialRampToValueAtTime(.001,t+.6);
        const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
        o.connect(lp);lp.connect(g);send(g,1,.4);o.start(t);o.stop(t+.65);
      });
    }catch(e){}
  }
  function tumble(){
    if(!on||!ready)return; resume();
    try{
      const o=c.createOscillator();o.type='square';
      o.frequency.setValueAtTime(600,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(100,c.currentTime+.2);
      const g=c.createGain();g.gain.setValueAtTime(.1,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200;
      o.connect(lp);lp.connect(g);send(g,1,.3);o.start();o.stop(c.currentTime+.27);
    }catch(e){}
  }
  function buy(premium=false){
    if(!on||!ready)return; resume();
    try{
      const notes=premium?
        [261.63,329.63,392,523.25,659.25,783.99,1046.5,1318.5]:
        [261.63,329.63,392,523.25,659.25];
      notes.forEach((f,i)=>{
        const o=c.createOscillator();o.type='sine';o.frequency.value=f;
        const g=c.createGain();const t=c.currentTime+i*.06;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.03);
        g.gain.exponentialRampToValueAtTime(.001,t+.8);
        o.connect(g);send(g,1,.5);o.start(t);o.stop(t+.82);
      });
      thunder(1.2);
    }catch(e){}
  }
  function strike(){
    if(!on||!ready)return; resume();
    try{
      const o=c.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(150,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(30,c.currentTime+.5);
      const g=c.createGain();g.gain.setValueAtTime(.5,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.75);
      o.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+.8);
    }catch(e){}
  }
  function chime(){
    if(!on||!ready)return;
    try{
      const notes=[329.63,392,440,523.25,587.33,659.25];
      const f=notes[Math.floor(Math.random()*notes.length)];
      const o=c.createOscillator();o.type='sine';o.frequency.value=f;
      const g=c.createGain();const t=c.currentTime;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.03,t+.9);
      g.gain.exponentialRampToValueAtTime(.001,t+4);
      o.connect(g);send(g,1,.7);o.start(t);o.stop(t+4);
    }catch(e){}
  }
  function droneOn(){
    if(!on||drone||!ready)return;
    try{
      const o1=c.createOscillator(),o2=c.createOscillator(),o3=c.createOscillator();
      o1.type='sine';o1.frequency.value=55;
      o2.type='sine';o2.frequency.value=82.5;
      o3.type='triangle';o3.frequency.value=110;
      const g=c.createGain();g.gain.value=.03;
      const lfo=c.createOscillator();lfo.frequency.value=.08;
      const lg=c.createGain();lg.gain.value=.015;
      lfo.connect(lg);lg.connect(g.gain);
      o1.connect(g);o2.connect(g);o3.connect(g);g.connect(mg);
      o1.start();o2.start();o3.start();lfo.start();
      drone={o1,o2,o3,lfo};
      chimeTimer=setInterval(()=>{if(Math.random()<.5)chime()},6500);
    }catch(e){}
  }
  function droneOff(){
    if(!drone)return;
    try{drone.o1.stop();drone.o2.stop();drone.o3.stop();drone.lfo.stop()}catch(e){}
    drone=null;
    if(chimeTimer){clearInterval(chimeTimer);chimeTimer=null}
  }
  function toggle(){
    on=!on;
    if(!on)droneOff(); else { init(); resume(); droneOn(); }
    return on;
  }
  return {thunder,reelStop,reelSpin,mult,win,tumble,buy,strike,
          droneOn,droneOff,init,resume,toggle,get on(){return on},get ready(){return ready}};
})();

/* ================= API ================= */
async function api(path, opts={}){
  const token = localStorage.getItem('sc_token');
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'خطأ');
  return data;
}
function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = isErr ? 'err on' : 'on';
  setTimeout(() => t.classList.remove('on'), 2500);
}

/* ================= AUTH ================= */
(function initAuth(){
  const auth = $('auth');
  $('goSignup').onclick = () => {
    $('loginForm').style.display = 'none';
    $('signupForm').style.display = 'block';
    $('authTitle').textContent = 'إنشاء حساب';
    $('authSub').textContent = '— انضم إلى العاصفة —';
    $('authErr').classList.remove('on');
  };
  $('goLogin').onclick = () => {
    $('signupForm').style.display = 'none';
    $('loginForm').style.display = 'block';
    $('authTitle').textContent = 'STORMCROWN';
    $('authSub').textContent = '— بوابة العاصفة —';
    $('authErr').classList.remove('on');
  };
  function showErr(m){ $('authErr').textContent = '⚠ '+m; $('authErr').classList.add('on'); }

  const urlParams = new URLSearchParams(location.search);
  const refCode = urlParams.get('ref') || '';
  if(refCode) $('suInvite').value = refCode;

  $('signupBtn').onclick = async () => {
    Aud.init(); Aud.resume();
    $('authErr').classList.remove('on');
    const first = $('suFirst').value.trim();
    const last = $('suLast').value.trim();
    const phone = $('suPhone').value.trim();
    const email = $('suEmail').value.trim();
    const password = $('suPass').value;
    const inviteCode = $('suInvite').value.trim();
    if(!first || first.length < 2) return showErr('الاسم مطلوب');
    if(!last || last.length < 2) return showErr('الكنية مطلوبة');
    if(!phone || phone.length < 8) return showErr('رقم الهاتف غير صحيح');
    if(!email || !email.includes('@')) return showErr('البريد غير صحيح');
    if(!password || password.length < 4) return showErr('كلمة المرور 4 أحرف على الأقل');
    try {
      const res = await api('/api/register', {
        method: 'POST',
        body: JSON.stringify({ first, last, phone, email, password, inviteCode })
      });
      localStorage.setItem('sc_token', res.token);
      localStorage.setItem('sc_user', JSON.stringify(res.user));
      $('authTitle').textContent = 'مرحباً '+first+'!';
      $('authSub').textContent = '— جاهز —';
      setTimeout(() => enterGame(res.user), 800);
    } catch(e){ showErr(e.message); }
  };

  $('loginBtn').onclick = async () => {
    Aud.init(); Aud.resume();
    $('authErr').classList.remove('on');
    const id = $('loginId').value.trim();
    const password = $('loginPass').value;
    if(!id) return showErr('أدخل رقم الهاتف أو البريد');
    if(!password) return showErr('أدخل كلمة المرور');
    try {
      const res = await api('/api/login', {
        method: 'POST',
        body: JSON.stringify({ id, password })
      });
      localStorage.setItem('sc_token', res.token);
      localStorage.setItem('sc_user', JSON.stringify(res.user));
      $('authTitle').textContent = 'مرحباً '+res.user.first+'!';
      $('authSub').textContent = '— جاري الدخول —';
      setTimeout(() => enterGame(res.user), 700);
    } catch(e){ showErr(e.message); }
  };

  window.enterGame = async (user) => {
    S.bal = user.balance || 0;
    S.best = user.best || 0;
    S.laps = user.laps || 0;
    upd();
    auth.classList.add('fade');
    setTimeout(() => {

const ExplosionFX = (() => {
  const cvs = document.createElement('canvas');
  cvs.id = 'boomFX';
  cvs.style.cssText = 'position:fixed;inset:0;z-index:50;pointer-events:none';
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  const particles = [];
  const colors = ['#ffd24a', '#ffaa40', '#ffe89a'];
  function boom(x, y){
    for(let i = 0; i < 6; i++){
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 3.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 1,
        life: 1,
        decay: 0.028 + Math.random() * 0.015,
        size: 1.8 + Math.random() * 2,
        col: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }
  function update(){
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15; p.vx *= 0.95; p.life -= p.decay;
      if(p.life <= 0) particles.splice(i, 1);
    }
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    for(const p of particles){
      ctx.globalAlpha = p.life * 0.7;
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function loop(){ update(); draw(); requestAnimationFrame(loop); }
  loop();
  return { boom };
})();

function rSymVisual(){
  const r=Math.random()*100;
  if(r<15)return{type:'zeus',v:rnd(ZEUS_MAIN)};
  if(r<20)return{type:'scatter'};
  if(r<30)return{type:'gem_purple'};
  if(r<40)return{type:'gem_green'};
  if(r<49)return{type:'gem_blue'};
  if(r<58)return{type:'gem_red'};
  if(r<66)return{type:'flaming'};
  if(r<73)return{type:'ring'};
  if(r<79)return{type:'hourglass'};
  if(r<84)return{type:'chalice'};
  if(r<88)return{type:'crown'};
  if(r<90)return{type:'zeusFist'};
  return{type:'gem_purple'};
}
function stripVisual(){const a=[];for(let i=0;i<ROWS+3;i++)a.push(rSymVisual());return a}

let lt=0;
function loop(t){
  const dt=Math.min(50,t-lt);lt=t;
  for(let x=0;x<COLS;x++){
    if(!RS.stop[x]){
      RS.off[x]+=RS.spd[x]*dt/16;
      while(RS.off[x]>=CELL){
        RS.off[x]-=CELL;RS.str[x].unshift(rSymVisual());RS.str[x].pop();
      }
    }else if(Math.abs(RS.bounce[x])>0.1||Math.abs(RS.bounceV[x])>0.1){
      RS.bounceV[x]+=-RS.bounce[x]*.35;
      RS.bounceV[x]*=.72;
      RS.bounce[x]+=RS.bounceV[x];
      if(Math.abs(RS.bounce[x])<.05&&Math.abs(RS.bounceV[x])<.05){
        RS.bounce[x]=0;RS.bounceV[x]=0;
      }
    }
  }
  draw(t);requestAnimationFrame(loop);
}

    const pulse=.6+Math.sin(t/100)*.4;
    rcx.save();rcx.globalAlpha=pulse*.5;
    const rg=rcx.createRadialGradient(ccx,ccy,0,ccx,ccy,sz*.85);
    rg.addColorStop(0,fire?'rgba(255,140,0,.8)':sym.type==='zeus'?'rgba(255,210,74,.7)':'rgba(255,255,255,.5)');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    rcx.fillStyle=rg;rcx.fillRect(ccx-sz,ccy-sz,sz*2,sz*2);
    rcx.restore();
  }
  if(winHighlight){
    rcx.save();
    rcx.globalAlpha=.55+Math.sin(t/80)*.35;
    rcx.strokeStyle='#2ecc71';
    rcx.lineWidth=4;
    rcx.shadowColor='#2ecc71';
    rcx.shadowBlur=18;
    rcx.strokeRect(x+6,y+6,CELL-12,CELL-12);
    rcx.restore();
  }
  paintSymbol(rcx,sym.type,ccx,ccy,iconSize);
  if(sym.type==='zeus'){
    rcx.save();
    rcx.textAlign='center';rcx.textBaseline='middle';
    rcx.font='900 22px serif';
    const grad=rcx.createLinearGradient(0,ccy+16,0,ccy+38);
    grad.addColorStop(0,'#fff');grad.addColorStop(.5,'#ffd24a');grad.addColorStop(1,'#ff8c00');
    rcx.fillStyle=grad;
    rcx.shadowColor='#000';rcx.shadowBlur=6;
    rcx.strokeStyle='#000';rcx.lineWidth=3;
    rcx.strokeText(sym.v+'×',ccx,ccy+sz*.32);
    rcx.fillText(sym.v+'×',ccx,ccy+sz*.32);
    rcx.restore();
  }
}

let currentWinSymbols = [];

function draw(t){
  const W=rcv.width,H=rcv.height;
  rcx.clearRect(0,0,W,H);
  const innerBg=rcx.createRadialGradient(W/2,H/2,100,W/2,H/2,W);
  if(S.fire){
    innerBg.addColorStop(0,'rgba(90,30,0,.35)');
    innerBg.addColorStop(1,'rgba(10,0,10,.5)');
  }else{
    innerBg.addColorStop(0,'rgba(40,15,80,.25)');
    innerBg.addColorStop(1,'rgba(5,0,20,.45)');
  }
  rcx.fillStyle=innerBg;
  rcx.fillRect(PADX,PADY,COLS*CELL,ROWS*CELL);
  rcx.strokeStyle=S.fire?'rgba(255,140,0,.15)':'rgba(155,89,255,.15)';
  rcx.lineWidth=1;
  for(let x=1;x<COLS;x++){
    rcx.beginPath();rcx.moveTo(PADX+x*CELL,PADY);
    rcx.lineTo(PADX+x*CELL,PADY+ROWS*CELL);rcx.stroke();
  }
  for(let y=1;y<ROWS;y++){
    rcx.beginPath();rcx.moveTo(PADX,PADY+y*CELL);
    rcx.lineTo(PADX+COLS*CELL,PADY+y*CELL);rcx.stroke();
  }
  for(let x=0;x<COLS;x++){
    const px=PADX+x*CELL;
    rcx.save();rcx.beginPath();rcx.rect(px,PADY,CELL,ROWS*CELL);rcx.clip();
    if(RS.stop[x]){
      const b=RS.bounce[x];
      for(let y=0;y<ROWS;y++)if(S.grid[x]&&S.grid[x][y]){
        const sym=S.grid[x][y];
        const hl = currentWinSymbols.includes(sym.type);
        drawSymbolAt(px,PADY+y*CELL+b,sym,t,S.fire,hl);
      }
    }else{
      const st=RS.str[x]||[],off=RS.off[x]%CELL;
      rcx.save();rcx.globalAlpha=.2;
      for(let i=0;i<st.length;i++){
        const yy=PADY+i*CELL-off;
        if(yy>PADY-CELL&&yy<PADY+ROWS*CELL+CELL)
          drawSymbolAt(px,yy,st[i],t,S.fire,false);
      }
      rcx.restore();
      for(let i=0;i<st.length;i++){
        const yy=PADY+i*CELL-off+14;
        if(yy>PADY-CELL&&yy<PADY+ROWS*CELL+CELL)
          drawSymbolAt(px,yy,st[i],t,S.fire,false);
      }
    }
    rcx.restore();
  }
  if(S.fire){
    const fg=rcx.createLinearGradient(0,H,0,H-100);
    fg.addColorStop(0,'rgba(255,80,0,.25)');
    fg.addColorStop(1,'rgba(255,80,0,0)');
    rcx.fillStyle=fg;rcx.fillRect(0,H-100,W,100);
  }
}

async function animSpinToGrid(finalGrid){
  for(let x=0;x<COLS;x++){
    RS.str[x]=stripVisual();RS.off[x]=0;RS.stop[x]=false;
    RS.spd[x]=40+Math.random()*20;
    RS.bounce[x]=0;RS.bounceV[x]=0;
    Aud.reelSpin(x);
  }
  const dl=[300,420,540,660,780,900];
  for(let x=0;x<COLS;x++){
    await sl(dl[x]-(x>0?dl[x-1]:0));
    RS.stop[x]=true;RS.off[x]=0;
    for(let y=0;y<ROWS;y++) S.grid[x][y]=finalGrid[x][y];
    RS.bounce[x]=-14;RS.bounceV[x]=-3;
    Aud.reelStop(x);
    shake(.25,140);
  }
  await sl(150);
}

async function animTumbleTo(nextGrid, winningSymbols){
  const boomPoints = [];
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
    if(S.grid[x][y] && winningSymbols.includes(S.grid[x][y].type)){
      boomPoints.push({x,y});
      S.grid[x][y]=null;
    }
  }
  if(boomPoints.length>0){
    const rect=rcv.getBoundingClientRect();
    const scaleX=rect.width/rcv.width, scaleY=rect.height/rcv.height;
    boomPoints.forEach((pt,idx)=>{
      setTimeout(()=>{
        const px=rect.left+(PADX+pt.x*CELL+CELL/2)*scaleX;
        const py=rect.top+(PADY+pt.y*CELL+CELL/2)*scaleY;
        ExplosionFX.boom(px,py);
      }, idx*35);
    });
  }
  shake(0.5,150);
  Aud.thunder(0.6);
  await sl(260);

  for(let x=0;x<COLS;x++){
    S.grid[x] = nextGrid[x].slice();
    RS.bounce[x] = -10;
    RS.bounceV[x] = -2;
    Aud.reelStop(x);
    await sl(55);
  }
  await sl(180);
}

function shake(i=1,d=400){
  const e=$('mainArea');if(!e)return;const st=performance.now();
  (function lp(t){
    const p=(t-st)/d;if(p>=1){e.style.transform='';return}
    const a=i*8*(1-p);
    e.style.transform='translate('+(Math.random()-.5)*a+'px,'+(Math.random()-.5)*a+'px)';
    requestAnimationFrame(lp);
  })(st);
}
function flash(d=200,i=1){
  const f=$('flash');f.style.transition='none';f.style.opacity=i;
  requestAnimationFrame(()=>{
    f.style.transition='opacity '+d+'ms ease-out';f.style.opacity=0;
  });
}
function bigShow(t,d=1400){
  const e=$('bigTxt');e.textContent=t;
  e.style.transition='none';e.style.opacity=0;
  e.style.transform='translate(-50%,-50%) scale(.3)';
  requestAnimationFrame(()=>{
    e.style.transition='all .5s cubic-bezier(.2,2,.4,1)';
    e.style.opacity=1;e.style.transform='translate(-50%,-50%) scale(1)';
    setTimeout(()=>{
      e.style.transition='all .7s ease-in';e.style.opacity=0;
      e.style.transform='translate(-50%,-50%) scale(1.6)';
    },d);
  });
}
function multPop(v,x,y){
  const el=document.createElement('div');
  el.className='mpop';el.textContent=v+'×';
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

/* ============ Spin ============ */
async function spin(){
  if(S.spin)return;
  const isFree = S.fs > 0;
  if(!isFree && S.bal < S.bet){ toast('رصيد غير كافٍ',true); return; }
  Aud.resume();
  S.spin=true;
  const wheel=$('spinWheel');
  wheel.classList.add('spinning','disabled');
  $('buyNormal').disabled=true;$('buyPremium').disabled=true;
  const currentBet=S.bet;

  try {
    const res = await api('/api/spin', {
      method:'POST',
      body: JSON.stringify({ bet: currentBet, freeSpin: isFree })
    });

    if(isFree) S.fs--;

    const chains = res.chains || [];
    const finalGrid = res.finalGrid;
    const totalWin = res.totalWin || 0;
    const scatterCount = res.scatterCount || 0;

    S.bal = res.balance;
    upd();

    const firstGrid = chains.length > 0 ? chains[0].grid : finalGrid;
    await animSpinToGrid(firstGrid);
    S.grid = firstGrid;

    let cumulativeMult = 0;

    for(let i=0;i<chains.length;i++){
      const chain = chains[i];

      if(chain.zeusSum > 0){
        Aud.mult(chain.zeusSum);Aud.strike();
        ZeusChar.setState('angry',1500);
        const rect=rcv.getBoundingClientRect();
        for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
          const s=S.grid[x][y];
          if(s&&s.type==='zeus'){
            const px=rect.left+PADX+x*CELL+CELL/2;
            const py=rect.top+PADY+y*CELL+CELL/2;
            multPop(s.v+'×',px,py);
          }
        }
        await sl(400);
      }

      currentWinSymbols = chain.wins.map(w=>w.symbol);
      const chainWin = chain.winAmount;
      cumulativeMult = chain.cumulativeMult || 0;
      S.mc = cumulativeMult;

      if(isFree && cumulativeMult > 0) $('multHud').classList.add('hot');

      Aud.win(1 + i*0.08);
      if(chainWin >= 500) Aud.thunder(.9);
      flash(180, .35 + Math.min(chainWin/2500, .4));
      shake(.9 + Math.min(chainWin/1200, 1.5), 300);

      const mt = chain.multiplier > 1 ? ' × '+chain.multiplier+'×' : '';
      log('سلسلة '+(i+1)+': '+Math.floor(chainWin)+' ل.س'+mt);
      if(chainWin >= 500) ZeusChar.setState('angry',2500);
      else if(chainWin >= 150) ZeusChar.setState('happy',2000);

      await sl(700);

      const nextGrid = (i < chains.length - 1) ? chains[i+1].grid : finalGrid;
      currentWinSymbols = [];
      Aud.tumble();
      await animTumbleTo(nextGrid, chain.wins.map(w=>w.symbol));
      S.grid = nextGrid;
    }

    currentWinSymbols = [];
    S.grid = finalGrid;

    S.lw = totalWin;
    S.won += totalWin;
    if(totalWin > S.best) S.best = totalWin;
    upd();
    addHistory(currentBet, totalWin, cumulativeMult);

    const tier = getWinTier(totalWin);
    if(tier){
      setTimeout(()=>showBigWinOverlay(totalWin,0,tier),400);
      await sl(2500);
    }

    if(totalWin === 0){
      log('— لا فوز —');
      ZeusChar.setState('sad',2000);
    } else {
      log('✅ إجمالي: '+Math.floor(totalWin)+' ل.س');
    }

    if(scatterCount >= 4 && S.fs === 0 && !isFree){
      S.fs = 8;
      S.mc = 0;
      S.fsType = 'عادي';
      log('⚡ '+scatterCount+' موزعة — 8 جولات مجانية');
      flash(700,1); shake(2.5,700);
      fireOn(false);
      ZeusChar.setState('angry',3000);
      setTimeout(()=>showBigWinOverlay(totalWin,8,'fs'),500);
      await sl(2500);
    }

    if(S.fs > 0){
      S.spin = false;
      wheel.classList.remove('spinning','disabled');
      if(S.fs === 1 && S.fs === 0) fireOff();
      setTimeout(spin, 700);
      return;
    }

    S.spin = false;
    wheel.classList.remove('spinning','disabled');
    $('buyNormal').disabled=false;
    $('buyPremium').disabled=false;
    if(S.fire) fireOff();

  } catch(e){
    console.error(e);
    toast(e.message || 'خطأ في الجولة', true);
    S.spin = false;
    wheel.classList.remove('spinning','disabled');
    $('buyNormal').disabled=false;
    $('buyPremium').disabled=false;
    refreshMe();
  }
}

async function loadWalletHistory(){
  try{
    const {deposits,withdraws}=await api('/api/wallet/history');
    const all=[
      ...deposits.map(d=>({...d,kind:'deposit'})),
      ...withdraws.map(w=>({...w,kind:'withdraw'}))
    ].sort((a,b)=>b.created_at-a.created_at).slice(0,40);
    if(!all.length){
      $('walletHistoryList').innerHTML='<div style="text-align:center;color:#888;padding:20px">لا يوجد سجل</div>';
      return;
    }
    $('walletHistoryList').innerHTML=all.map(x=>{
      const isDep=x.kind==='deposit';
      const amount=isDep?x.amount:-x.amount;
      const cur=PAY_INFO[x.method_code]?.cur||'';
      const st=x.status==='pending'?'⏳':x.status==='approved'?'✅':'❌';
      return '<div class="historyItem '+x.status+'"><span>'+(isDep?'📥':'📤')+' '+x.method_code+'</span><span>'+amount+' '+cur+'</span><span>'+st+'</span></div>';
    }).join('');
  }catch(e){
    $('walletHistoryList').innerHTML='<div style="color:#ff6a6a;text-align:center;padding:20px">⚠ '+e.message+'</div>';
  }
}

$('agentBadge').onclick=async()=>{
  $('agentModal').classList.add('on');
  try{
    const info=await api('/api/agent/info');
    const link=location.origin+'/?ref='+info.invite_code;
    const levelTxt=info.agent_level===0?'لاعب عادي':
                   info.agent_level===1?'🥉 وكيل 1 — 3%':
                   info.agent_level===2?'🥈 وكيل 2 — 5%':'🥇 وكيل 3 — 8%';
    $('agentContent').innerHTML=
      '<div class="agentBox"><b>كود الدعوة:</b> <span style="font-family:monospace;color:#fff">'+info.invite_code+'</span></div>'+
      '<div class="agentBox"><b>رابط الدعوة (اضغط لنسخ):</b><div class="agentLink" id="inviteLink">'+link+'</div></div>'+
      '<div class="agentStats">'+
        '<div class="agentStat"><div class="lbl">المستوى</div><div class="val">'+levelTxt+'</div></div>'+
        '<div class="agentStat"><div class="lbl">إجمالي عمولات</div><div class="val">'+(info.total_commission||0).toLocaleString()+'</div></div>'+
        '<div class="agentStat"><div class="lbl">عدد الإحالات</div><div class="val">'+info.referrals_count+'</div></div>'+
        '<div class="agentStat"><div class="lbl">خسائر المُحالين</div><div class="val">'+(info.stats.total_ref_lost||0).toLocaleString()+'</div></div>'+
      '</div>'+
      (info.agent_level===0?'<button class="walletBtn" onclick="becomeAgent()" style="background:linear-gradient(180deg,#9b59ff,#4a1a7a)">✨ ترقية إلى وكيل</button>':'');
    const il=$('inviteLink');
    if(il)il.onclick=()=>{
      if(navigator.clipboard){
        navigator.clipboard.writeText(link).then(()=>toast('✅ تم نسخ الرابط')).catch(()=>{});
      }
    };
  }catch(e){
    $('agentContent').innerHTML='<div style="color:#ff6a6a;padding:20px">⚠ '+e.message+'</div>';
  }
};
window.becomeAgent=async()=>{
