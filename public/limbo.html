<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#050a10">
<title>📈 ليمبو العاصفة — STORMLIMBO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Amiri:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#050a10;color:#fff;font-family:'Amiri',serif;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#topBtns{position:fixed;top:6px;left:0;right:0;z-index:60;height:48px;pointer-events:none}
#topBtns button{pointer-events:auto;position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid #4a9eff;background:linear-gradient(180deg,rgba(10,40,90,.95),rgba(5,10,30,.95));cursor:pointer;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 0 15px rgba(74,158,255,.4)}
#topBtns button:active{transform:scale(.9)}
#topBtns button svg{width:100%;height:100%;fill:#4a9eff}
#homeBtn{top:0;left:6px}
#soundBtn{top:0;right:6px}

#balBox{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;background:linear-gradient(180deg,rgba(10,40,90,.95),rgba(5,10,30,.98));border:2px solid #4a9eff;border-radius:10px;padding:4px 16px;text-align:center;box-shadow:0 0 20px rgba(74,158,255,.5)}
#balBox small{display:block;font-size:9px;color:#8ec8ff;font-family:'Cinzel Decorative',serif}
#balBox b{color:#fff;font-family:monospace;font-size:16px;text-shadow:0 0 10px #4a9eff}

#game{position:fixed;inset:0;display:flex;flex-direction:column;padding:52px 0 0 0;background:radial-gradient(ellipse at 50% 0%,#0a2a5a 0%,transparent 50%),radial-gradient(ellipse at 50% 100%,#1a0a3a 0%,transparent 50%),linear-gradient(180deg,#050a10 0%,#0a1525 50%,#050a10 100%)}

#resultArea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;position:relative;min-height:0;overflow:hidden}
#resultLabel{font-family:'Cinzel Decorative',serif;font-size:12px;color:#8ec8ff;letter-spacing:.3em;text-shadow:0 0 15px rgba(74,158,255,.8);text-transform:uppercase}
#bigMult{font-family:'Cinzel Decorative',serif;font-size:clamp(64px,20vw,140px);font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#4a9eff,#1a3a8a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 35px rgba(74,158,255,.8));transition:all .3s;font-feature-settings:'tnum'}
#bigMult.rolling{animation:rollShake .1s linear infinite}
#bigMult.win{background:linear-gradient(180deg,#fff,#2ecc71,#0a4a20);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 40px #2ecc71)}
#bigMult.lose{background:linear-gradient(180deg,#fff,#ff3a3a,#5a0000);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 40px #ff3a3a)}
@keyframes rollShake{0%{transform:translate(-1px,1px) rotate(-1deg)}25%{transform:translate(1px,-1px) rotate(1deg)}50%{transform:translate(-1px,-1px) rotate(-1deg)}75%{transform:translate(1px,1px) rotate(1deg)}100%{transform:translate(-1px,1px) rotate(-1deg)}}

#hintTxt{font-size:13px;color:#8ec8ff;text-align:center;min-height:20px;font-family:'Amiri',serif}
#hintTxt.win{color:#7effb0;font-weight:bold;font-size:16px;text-shadow:0 0 15px #2ecc71}
#hintTxt.lose{color:#ff8080;font-weight:bold;font-size:16px;text-shadow:0 0 15px #ff3a3a}

#targetDisplay{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
.tgtBox{background:linear-gradient(180deg,rgba(10,40,90,.5),rgba(5,10,30,.85));border:2px solid #4a9eff;border-radius:10px;padding:8px 16px;text-align:center;min-width:120px}
.tgtBox small{display:block;font-size:9px;color:#8ec8ff;font-family:'Cinzel Decorative',serif;letter-spacing:.1em;margin-bottom:3px}
.tgtBox b{color:#fff;font-family:monospace;font-size:20px;text-shadow:0 0 12px #4a9eff;font-weight:900}
.tgtBox.target b{color:#ffd24a;text-shadow:0 0 15px #ffd24a}

#targetWrap{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;max-width:480px;padding:0 20px}
#targetWrap label{font-size:11px;color:#8ec8ff;font-family:'Cinzel Decorative',serif;letter-spacing:.15em;text-align:center}
#targetInputWrap{display:flex;gap:6px;width:100%;align-items:center;justify-content:center;flex-wrap:wrap}
.tgtBtn{padding:8px 14px;font-family:'Amiri',serif;font-weight:700;font-size:12px;border-radius:9px;cursor:pointer;border:2px solid #4a9eff;background:linear-gradient(180deg,rgba(10,40,90,.5),rgba(5,10,30,.85));color:#8ec8ff;transition:all .15s;min-width:60px}
.tgtBtn.active{background:linear-gradient(180deg,#4a9eff,#1a3a8a);color:#fff;box-shadow:0 0 18px rgba(74,158,255,.7);border-color:#8ec8ff}
.tgtBtn:active{transform:scale(.94)}
.tgtBtn:disabled{opacity:.5;cursor:not-allowed}

#customTarget{background:rgba(5,10,30,.9);border:2px solid #4a9eff;border-radius:10px;padding:10px 14px;color:#fff;font-family:monospace;font-size:16px;width:120px;text-align:center;font-weight:900}
#customTarget:focus{outline:none;border-color:#ffd24a;box-shadow:0 0 20px rgba(255,210,74,.5)}

#stats{display:flex;gap:6px;justify-content:center;padding:8px 10px;flex-shrink:0;flex-wrap:wrap}
.statBox{background:linear-gradient(180deg,rgba(10,40,90,.5),rgba(5,10,30,.85));border:2px solid #4a9eff;border-radius:9px;padding:5px 12px;text-align:center;min-width:78px}
.statBox small{display:block;font-size:8px;color:#8ec8ff;font-family:'Cinzel Decorative',serif;letter-spacing:.05em}
.statBox b{color:#fff;font-family:monospace;font-size:14px;text-shadow:0 0 10px #4a9eff}
.statBox.hot{border-color:#2ecc71;box-shadow:0 0 15px rgba(46,204,113,.5)}
.statBox.hot b{color:#7effb0;text-shadow:0 0 10px #2ecc71}

#ctrlBar{flex-shrink:0;background:linear-gradient(180deg,rgba(5,15,30,.98),rgba(3,5,15,.99));border-top:2px solid #4a9eff;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 40px rgba(74,158,255,.2)}

.betRow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.betBtn{padding:8px 14px;font-family:'Amiri',serif;font-weight:700;font-size:14px;border-radius:9px;cursor:pointer;border:2px solid #4a9eff;background:linear-gradient(180deg,rgba(10,40,90,.95),rgba(5,10,30,.98));color:#8ec8ff;min-width:44px}
.betBtn:active{transform:scale(.94)}
.betBtn:disabled{opacity:.4;cursor:not-allowed}
.betDisplay{background:rgba(5,15,30,.9);border:2px solid #4a9eff;padding:6px 16px;border-radius:10px;text-align:center;min-width:120px}
.betDisplay small{display:block;font-size:9px;color:#8ec8ff;font-family:'Cinzel Decorative',serif}
.betDisplay b{color:#fff;font-family:monospace;font-size:16px;text-shadow:0 0 10px #4a9eff}

#rollBtn{width:100%;max-width:360px;margin:0 auto;padding:16px;font-family:'Cinzel Decorative',serif;font-size:17px;font-weight:900;border-radius:12px;cursor:pointer;border:3px solid #ffd24a;background:linear-gradient(180deg,#4a9eff,#1a3a8a);color:#fff;letter-spacing:.05em;box-shadow:0 0 30px rgba(74,158,255,.6);transition:all .15s}
#rollBtn:active{transform:scale(.97)}
#rollBtn:disabled{opacity:.5;cursor:not-allowed}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(180deg,#2ecc71,#00a050);color:#fff;padding:10px 18px;border-radius:8px;font-weight:bold;z-index:9999;transition:transform .3s;font-size:12px;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:linear-gradient(180deg,#ff4a4a,#8b0000)}

#trail{position:absolute;inset:0;pointer-events:none;overflow:hidden}

@keyframes floatUp{0%{transform:translate(-50%,0) scale(.3);opacity:0}20%{transform:translate(-50%,-20%) scale(1.3);opacity:1}60%{transform:translate(-50%,-30%) scale(1);opacity:1}100%{transform:translate(-50%,-200%) scale(.8);opacity:0}}
.trailNum{position:absolute;font-family:monospace;font-weight:900;font-size:14px;pointer-events:none;animation:floatUp 1.4s ease-out forwards;text-shadow:0 0 8px currentColor}

@media (max-width:640px){
.statBox{min-width:66px;padding:4px 8px}
.statBox b{font-size:12px}
.betDisplay{min-width:100px}
#rollBtn{font-size:15px;padding:14px}
.tgtBox{padding:6px 12px;min-width:100px}
.tgtBox b{font-size:16px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ic-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
<symbol id="ic-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
<symbol id="ic-sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 4v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
</defs></svg>

<div id="topBtns">
<button id="homeBtn"><svg><use href="#ic-home"/></svg></button>
<button id="soundBtn"><svg id="soundIcon"><use href="#ic-sound-on"/></svg></button>
</div>
<div id="balBox"><small>الرصيد</small><b id="bal">0</b></div>

<div id="game">
<div id="stats">
<div class="statBox"><small>الرهان</small><b id="sBet">100</b></div>
<div class="statBox hot"><small>الربح المحتمل</small><b id="sPayout">0</b></div>
<div class="statBox"><small>فرصة الفوز</small><b id="sChance">—%</b></div>
<div class="statBox"><small>آخر نتيجة</small><b id="sLast">—</b></div>
</div>

<div id="resultArea">
<div id="resultLabel">النتيجة</div>
<div id="bigMult">1.00×</div>
<div id="hintTxt">حدد هدفك ثم اضغط "ارمِ"</div>

<div id="targetDisplay">
<div class="tgtBox target"><small>🎯 الهدف</small><b id="tgtVal">2.00×</b></div>
<div class="tgtBox"><small>💵 ستربح</small><b id="payoutVal">0</b></div>
</div>
</div>

<div id="trail"></div>

<div id="ctrlBar">
<div id="targetWrap">
<label>🎯 الهدف</label>
<div id="targetInputWrap">
<button class="tgtBtn" data-t="1.5">1.5×</button>
<button class="tgtBtn" data-t="2">2×</button>
<button class="tgtBtn active" data-t="3">3×</button>
<button class="tgtBtn" data-t="5">5×</button>
<button class="tgtBtn" data-t="10">10×</button>
<button class="tgtBtn" data-t="25">25×</button>
<button class="tgtBtn" data-t="100">100×</button>
<input type="number" id="customTarget" value="3" min="1.01" max="1000" step="0.01" placeholder="مخصص">
</div>
</div>
<div class="betRow">
<button class="betBtn" id="betDown">−</button>
<div class="betDisplay"><small>الرهان</small><b id="betVal">100</b></div>
<button class="betBtn" id="betUp">+</button>
</div>
<button id="rollBtn">📈 ارمِ</button>
</div>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const sl=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ AUDIO ============ */
const Aud=(()=>{
let c=null,mg=null,on=true,ready=false;
function init(){if(c)return;try{c=new(window.AudioContext||window.webkitAudioContext)();mg=c.createGain();mg.gain.value=.4;mg.connect(c.destination);ready=true}catch(e){}}
function resume(){if(!c)return;if(c.state==='suspended')c.resume().catch(()=>{})}
function tone(f,dur=.1,type='sine',vol=.2){if(!on||!ready)return;resume();try{const o=c.createOscillator();o.type=type;o.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+dur+.02)}catch(e){}}
function tick(f){tone(f||1000,.04,'square',.05)}
function whoosh(){if(!on||!ready)return;resume();try{const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.exponentialRampToValueAtTime(800,c.currentTime+.5);const g=c.createGain();g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200;o.connect(lp);lp.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+.62)}catch(e){}}
function win(){if(!on||!ready)return;resume();[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{setTimeout(()=>tone(f,.3,'sine',.18),i*70)})}
function bigWin(){if(!on||!ready)return;resume();[261.63,329.63,392,523.25,659.25,783.99,1046.5,1318.5,1567.98,2093].forEach((f,i)=>{setTimeout(()=>tone(f,.5,'sawtooth',.14),i*80)})}
function lose(){if(!on||!ready)return;resume();tone(220,.3,'sawtooth',.18);setTimeout(()=>tone(150,.4,'sawtooth',.15),120)}
function toggle(){on=!on;return on}
return{init,resume,tone,tick,whoosh,win,bigWin,lose,toggle,get on(){return on},get ready(){return ready}};
})();

async function api(path,opts={}){const token=localStorage.getItem('sc_token');const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers['Authorization']='Bearer '+token;const res=await fetch(path,{...opts,headers});const data=await res.json();if(!res.ok)throw new Error(data.error||'خطأ');return data}
function toast(msg,isErr){const t=$('toast');t.textContent=msg;t.className=isErr?'err on':'on';setTimeout(()=>t.classList.remove('on'),2500)}

const BETS=[20,50,100,200,500,1000,2000,5000,10000];
const S={bal:0,bi:2,bet:100,target:3,rolling:false,lastResult:null};

function updStats(){
  $('sBet').textContent=S.bet;
  $('betVal').textContent=S.bet;
  $('tgtVal').textContent=S.target.toFixed(2)+'×';
  const payout=Math.floor(S.bet*S.target);
  $('sPayout').textContent=payout.toLocaleString();
  $('payoutVal').textContent=payout.toLocaleString();
  const chance=(96/S.target).toFixed(2);
  $('sChance').textContent=chance+'%';
}
function updBal(){$('bal').textContent=Math.floor(S.bal).toLocaleString();const st=JSON.parse(localStorage.getItem('sc_user')||'{}');localStorage.setItem('sc_user',JSON.stringify({...st,balance:S.bal}))}

/* trail numbers */
function addTrailNumber(mult,win){
  const el=document.createElement('div');
  el.className='trailNum';
  el.textContent=mult.toFixed(2)+'×';
  el.style.color=win?'#7effb0':'#ff8080';
  el.style.left=(20+Math.random()*60)+'%';
  el.style.top=(30+Math.random()*30)+'%';
  $('trail').appendChild(el);
  setTimeout(()=>el.remove(),1500);
}

/* rolling animation */
async function animateRoll(finalMult){
  const el=$('bigMult');
  el.className='rolling';
  const start=performance.now();
  const dur=1400;
  let lastTick=0;
  let lastVal=1.00;
  return new Promise(res=>{
    function step(now){
      const p=Math.min(1,(now-start)/dur);
      // exponential slow down
      const speed=1-Math.pow(p,0.5);
      const target=1+(finalMult-1)*p*1.05;
      const rand=1+Math.random()*(target-1+0.5);
      lastVal=Math.max(1.00,rand);
      el.textContent=lastVal.toFixed(2)+'×';
      if(now-lastTick>50-speed*30){
        Aud.tick(800+lastVal*50);
        lastTick=now;
      }
      if(p<1) requestAnimationFrame(step);
      else {
        el.classList.remove('rolling');
        el.textContent=finalMult.toFixed(2)+'×';
        res();
      }
    }
    requestAnimationFrame(step);
  });
}

async function doRoll(){
  if(S.rolling) return;
  if(S.bal<S.bet){toast('رصيد غير كافٍ',true);return}
  S.rolling=true;
  $('rollBtn').disabled=true;
  $('rollBtn').textContent='⏳ جاري الرمي...';
  $('hintTxt').className='';
  $('hintTxt').textContent='...';
  Aud.init();Aud.resume();Aud.whoosh();

  try{
    const res=await api('/api/limbo/play',{method:'POST',body:JSON.stringify({bet:S.bet,target:S.target})});
    S.bal=res.balance;
    updBal();
    S.lastResult=res.result;
    $('sLast').textContent=res.result.toFixed(2)+'×';

    await animateRoll(res.result);
    addTrailNumber(res.result,res.won);

    const big=$('bigMult');
    if(res.won){
      big.className='win';
      $('hintTxt').className='win';
      $('hintTxt').textContent='🎉 ربحت '+res.payout.toLocaleString()+' ل.س';
      if(res.payout>=S.bet*5) Aud.bigWin(); else Aud.win();
      toast('🎉 فوز! ×'+res.result.toFixed(2)+' — +'+res.net.toLocaleString()+' ل.س');
    } else {
      big.className='lose';
      $('hintTxt').className='lose';
      $('hintTxt').textContent='💥 خسرت — النتيجة '+res.result.toFixed(2)+'× أقل من '+S.target.toFixed(2)+'×';
      Aud.lose();
      toast('😢 حظ أوفر',true);
    }
  }catch(e){
    toast(e.message,true);
    $('hintTxt').textContent='خطأ في الرمية';
  }

  S.rolling=false;
  $('rollBtn').disabled=false;
  $('rollBtn').textContent='📈 ارمِ';
}

$('rollBtn').onclick=doRoll;
$('betDown').onclick=()=>{if(S.rolling)return;if(S.bi>0){S.bi--;S.bet=BETS[S.bi];updStats()}};
$('betUp').onclick=()=>{if(S.rolling)return;if(S.bi<BETS.length-1){S.bi++;S.bet=BETS[S.bi];updStats()}};

document.querySelectorAll('.tgtBtn').forEach(b=>{
  b.onclick=()=>{
    if(S.rolling)return;
    document.querySelectorAll('.tgtBtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    S.target=parseFloat(b.dataset.t);
    $('customTarget').value=S.target;
    updStats();
    Aud.tick(1200);
  };
});

$('customTarget').addEventListener('input',e=>{
  if(S.rolling)return;
  let v=parseFloat(e.target.value);
  if(isNaN(v)||v<1.01)return;
  if(v>1000)v=1000;
  S.target=Math.round(v*100)/100;
  document.querySelectorAll('.tgtBtn').forEach(x=>x.classList.remove('active'));
  updStats();
});

$('customTarget').addEventListener('blur',e=>{
  let v=parseFloat(e.target.value);
  if(isNaN(v)||v<1.01)v=2;
  if(v>1000)v=1000;
  S.target=Math.round(v*100)/100;
  e.target.value=S.target;
  updStats();
});

$('homeBtn').onclick=()=>{if(S.rolling&&!confirm('الرمية في الهواء!'))return;location.href='/'};
$('soundBtn').onclick=()=>{const on=Aud.toggle();$('soundIcon').innerHTML='<use href="'+(on?'#ic-sound-on':'#ic-sound-off')+'"/>';if(on){Aud.init();Aud.resume()}};

async function refreshMe(){try{const u=await api('/api/me');S.bal=u.balance;updBal()}catch(e){if(e.message.includes('جلسة')||e.message.includes('مصرح'))location.href='/'}}

['click','touchstart','keydown'].forEach(ev=>{
  document.addEventListener(ev,()=>{Aud.init();Aud.resume()},{once:true});
});

(async()=>{
  const token=localStorage.getItem('sc_token');
  if(!token){location.href='/';return}
  try{
    const u=await api('/api/me');
    S.bal=u.balance;updBal();
    updStats();
  }catch(e){location.href='/'}
})();
</script>
</body>
</html>
