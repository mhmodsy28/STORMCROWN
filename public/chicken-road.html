<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0805">
<title>🐔 طريق الدجاجة — STORMCHICKEN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Amiri:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0805;color:#fff;font-family:'Amiri',serif;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

/* ===== TOP BUTTONS ===== */
#topBtns{position:fixed;top:6px;left:0;right:0;z-index:60;height:48px;pointer-events:none}
#topBtns button{pointer-events:auto;position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid #ffcc00;background:linear-gradient(180deg,rgba(60,40,10,.95),rgba(20,10,5,.95));cursor:pointer;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 0 15px rgba(255,204,0,.4)}
#topBtns button:active{transform:scale(.9)}
#topBtns button svg{width:100%;height:100%;fill:#ffcc00}
#homeBtn{top:0;left:6px}
#soundBtn{top:0;right:6px}

#balBox{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;background:linear-gradient(180deg,rgba(60,40,10,.95),rgba(20,10,5,.98));border:2px solid #ffcc00;border-radius:10px;padding:4px 16px;text-align:center;box-shadow:0 0 20px rgba(255,204,0,.5)}
#balBox small{display:block;font-size:9px;color:#ffe8a0;font-family:'Cinzel Decorative',serif}
#balBox b{color:#fff;font-family:monospace;font-size:16px;text-shadow:0 0 10px #ffcc00}

/* ===== GAME ===== */
#game{position:fixed;inset:0;display:flex;flex-direction:column;padding:52px 0 0 0;background:linear-gradient(180deg,#0a0805 0%,#1a1208 50%,#0a0805 100%)}

/* ===== STATS ===== */
#stats{display:flex;gap:6px;justify-content:center;padding:8px 10px;flex-shrink:0;flex-wrap:wrap;position:relative;z-index:5}
.statBox{background:linear-gradient(180deg,rgba(80,50,10,.6),rgba(30,15,5,.9));border:2px solid #ffcc00;border-radius:9px;padding:5px 12px;text-align:center;min-width:80px}
.statBox small{display:block;font-size:8px;color:#ffe8a0;font-family:'Cinzel Decorative',serif;letter-spacing:.05em}
.statBox b{color:#fff;font-family:monospace;font-size:14px;text-shadow:0 0 10px #ffcc00}
.statBox.hot{border-color:#2ecc71;box-shadow:0 0 15px rgba(46,204,113,.5)}
.statBox.hot b{color:#7effb0;text-shadow:0 0 10px #2ecc71}

/* ===== BOARD WRAP (scrollable) ===== */
#boardWrap{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 0;scrollbar-width:thin;scrollbar-color:#ffcc00 rgba(20,10,5,.5)}
#boardWrap::-webkit-scrollbar{width:6px}
#boardWrap::-webkit-scrollbar-track{background:rgba(20,10,5,.5)}
#boardWrap::-webkit-scrollbar-thumb{background:#ffcc00;border-radius:3px}

#board{position:relative;width:100%;min-height:100%}

/* ===== LANES ===== */
.lane{position:absolute;left:0;right:0;height:60px;background:linear-gradient(180deg,#3a3a3a 0%,#1f1f1f 50%,#3a3a3a 100%);border-top:2px solid rgba(255,204,0,.15);border-bottom:2px solid rgba(255,204,0,.15);overflow:hidden}
.lane::before{content:'';position:absolute;left:0;right:0;top:50%;height:3px;background:repeating-linear-gradient(90deg,#ffe8a0 0,#ffe8a0 22px,transparent 22px,transparent 44px);transform:translateY(-50%);opacity:.35;z-index:1}
.lane.completed{background:linear-gradient(180deg,#0a4a20 0%,#0a2a15 50%,#0a4a20 100%);border-color:rgba(46,204,113,.4)}
.lane.completed::before{background:repeating-linear-gradient(90deg,#7effb0 0,#7effb0 22px,transparent 22px,transparent 44px);opacity:.4}
.lane.failed{background:linear-gradient(180deg,#4a0a0a 0%,#2a0000 50%,#4a0a0a 100%);border-color:rgba(255,58,58,.5)}
.lane.failed::before{background:repeating-linear-gradient(90deg,#ff8080 0,#ff8080 22px,transparent 22px,transparent 44px);opacity:.4}
.lane.attempting{background:linear-gradient(180deg,#4a3a0a 0%,#2a1f00 50%,#4a3a0a 100%);border-color:#ffd24a;box-shadow:inset 0 0 20px rgba(255,210,74,.3)}

/* Lane multiplier badge */
.lane-badge{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.75);border:1px solid #ffcc00;border-radius:16px;padding:2px 10px;font-family:monospace;font-size:11px;font-weight:900;color:#ffcc00;z-index:3;pointer-events:none}
.lane.completed .lane-badge{background:linear-gradient(180deg,#2ecc71,#0a5a2a);color:#fff;border-color:#7effb0;box-shadow:0 0 10px rgba(46,204,113,.6)}

/* Start zone */
.startZone{position:absolute;left:0;right:0;height:60px;background:linear-gradient(180deg,#0a2010 0%,#051008 100%);border-top:3px solid #4a9eff;border-bottom:2px solid rgba(74,158,255,.4)}
.startZone::after{content:'START';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:'Cinzel Decorative',serif;font-size:11px;font-weight:900;color:#4a9eff;letter-spacing:.15em;text-shadow:0 0 10px rgba(74,158,255,.8)}
.finishZone{position:absolute;left:0;right:0;height:60px;background:linear-gradient(180deg,#4a3a0a 0%,#2a1a00 100%);border-top:2px solid rgba(255,210,74,.4);border-bottom:3px solid #ffd24a}
.finishZone::after{content:'🏁 FINISH';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:'Cinzel Decorative',serif;font-size:11px;font-weight:900;color:#ffd24a;letter-spacing:.15em;text-shadow:0 0 10px rgba(255,210,74,.8)}

/* ===== CARS ===== */
.car{position:absolute;top:50%;font-size:32px;pointer-events:none;z-index:2;will-change:left;line-height:1;transform:translateY(-50%)}
.car.ltr{animation:driveLTR linear infinite}
.car.rtl{animation:driveRTL linear infinite;transform:translateY(-50%) scaleX(-1)}
@keyframes driveLTR{from{left:-70px}to{left:calc(100% + 20px)}}
@keyframes driveRTL{from{left:calc(100% + 20px)}to{left:-70px}}

.car.crashCar{animation:crashDrive .35s ease-out forwards !important;z-index:20;filter:drop-shadow(0 0 12px #ff2a00)}
@keyframes crashDrive{0%{left:-80px}60%{left:42%}100%{left:44%}}

/* ===== CHICKEN ===== */
#chicken{position:absolute;left:50%;font-size:42px;z-index:10;pointer-events:none;line-height:1;filter:drop-shadow(0 0 10px #ffcc00);transition:bottom .45s cubic-bezier(.34,1.56,.64,1);transform:translateX(-50%)}
#chicken.walking{animation:chickenWalk .4s ease-in-out}
@keyframes chickenWalk{
  0%,100%{transform:translateX(-50%) rotate(0deg) scale(1)}
  25%{transform:translateX(-50%) rotate(-10deg) scale(1.05)}
  75%{transform:translateX(-50%) rotate(10deg) scale(1.05)}
}
#chicken.crashed{animation:chickenHit .9s ease-out forwards}
@keyframes chickenHit{
  0%{transform:translateX(-50%) translateY(0) rotate(0deg) scale(1);opacity:1}
  40%{transform:translateX(-50%) translateY(-120px) rotate(360deg) scale(1.3);opacity:1}
  100%{transform:translateX(-50%) translateY(-300px) rotate(900deg) scale(.4);opacity:0}
}
#chicken.landed{animation:chickenLand .4s ease-out}
@keyframes chickenLand{
  0%{transform:translateX(-50%) scale(1,1)}
  50%{transform:translateX(-50%) scale(1.3,.7)}
  100%{transform:translateX(-50%) scale(1,1)}
}

/* ===== EXPLOSION ===== */
.explosion{position:absolute;font-size:60px;z-index:25;pointer-events:none;animation:explodeAnim .8s ease-out forwards}
@keyframes explodeAnim{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  20%{transform:translate(-50%,-50%) scale(1.4);opacity:1}
  100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}
}

/* ===== DUST PARTICLES ===== */
.dust{position:absolute;font-size:20px;z-index:8;pointer-events:none;animation:dustFloat .8s ease-out forwards}
@keyframes dustFloat{
  0%{transform:translate(-50%,-50%) scale(.5);opacity:1}
  100%{transform:translate(-50%,-150%) scale(1.2);opacity:0}
}

/* ===== CTRL BAR ===== */
#ctrlBar{flex-shrink:0;background:linear-gradient(180deg,rgba(20,12,5,.98),rgba(10,6,3,.99));border-top:2px solid #ffcc00;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 40px rgba(255,204,0,.2)}

.diffRow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.diffBtn{padding:7px 12px;font-family:'Amiri',serif;font-weight:700;font-size:11px;border-radius:8px;cursor:pointer;border:2px solid #ffcc00;background:linear-gradient(180deg,rgba(60,40,10,.6),rgba(20,10,5,.9));color:#ffe8a0;transition:all .15s}
.diffBtn.active{background:linear-gradient(180deg,#ffcc00,#8a6000);color:#1a0a00;box-shadow:0 0 18px rgba(255,204,0,.7)}
.diffBtn:active{transform:scale(.94)}
.diffBtn:disabled{opacity:.5;cursor:not-allowed}

.betRow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.betBtn{padding:8px 14px;font-family:'Amiri',serif;font-weight:700;font-size:14px;border-radius:9px;cursor:pointer;border:2px solid #ffcc00;background:linear-gradient(180deg,rgba(60,40,10,.95),rgba(20,10,5,.98));color:#ffe8a0;min-width:44px}
.betBtn:active{transform:scale(.94)}
.betBtn:disabled{opacity:.4;cursor:not-allowed}
.betDisplay{background:rgba(20,12,5,.9);border:2px solid #ffcc00;padding:6px 16px;border-radius:10px;text-align:center;min-width:130px}
.betDisplay small{display:block;font-size:9px;color:#ffe8a0;font-family:'Cinzel Decorative',serif}
.betDisplay b{color:#fff;font-family:monospace;font-size:16px;text-shadow:0 0 10px #ffcc00}

.actionRow{display:flex;gap:8px;justify-content:center}
.actionBtn{flex:1;max-width:290px;padding:15px;font-family:'Cinzel Decorative',serif;font-size:15px;font-weight:900;border-radius:12px;cursor:pointer;border:3px solid;letter-spacing:.05em;transition:all .15s;min-width:130px}
.actionBtn:active{transform:scale(.97)}
.actionBtn:disabled{opacity:.5;cursor:not-allowed}
#startBtn{background:linear-gradient(180deg,#1a5a2a,#0a3015);border-color:#2ecc71;color:#d0ffe0;box-shadow:0 0 25px rgba(46,204,113,.5)}
#stepBtn{background:linear-gradient(180deg,#c9a000,#6a5000);border-color:#ffcc00;color:#fff;box-shadow:0 0 30px rgba(255,204,0,.7)}
#stepBtn:hover:not(:disabled){box-shadow:0 0 50px rgba(255,204,0,1)}
#cashBtn{background:linear-gradient(180deg,#c94000,#6a1a00);border-color:#ff8c00;color:#fff;box-shadow:0 0 30px rgba(255,140,0,.6);animation:cashPulse .7s ease-in-out infinite alternate}
@keyframes cashPulse{to{box-shadow:0 0 50px rgba(255,140,0,1)}}

/* ===== TOAST ===== */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(180deg,#2ecc71,#00a050);color:#fff;padding:10px 18px;border-radius:8px;font-weight:bold;z-index:9999;transition:transform .3s;font-size:12px;max-width:90vw;text-align:center;box-shadow:0 0 25px rgba(46,204,113,.5)}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:linear-gradient(180deg,#ff4a4a,#8b0000);box-shadow:0 0 25px rgba(255,74,74,.5)}

/* ===== RESULT OVERLAY ===== */
#overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.92);backdrop-filter:blur(6px)}
#overlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.resCard{position:relative;width:100%;max-width:420px;padding:26px;border-radius:18px;text-align:center;animation:pop .5s cubic-bezier(.19,1.6,.3,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.resCard.win{background:linear-gradient(180deg,#1a5a3a,#0a2015);border:3px solid #2ecc71;box-shadow:0 0 80px rgba(46,204,113,.7),inset 0 0 40px rgba(46,204,113,.15)}
.resCard.lose{background:linear-gradient(180deg,#5a0a0a,#1a0000);border:3px solid #ff3a3a;box-shadow:0 0 80px rgba(255,58,58,.7),inset 0 0 40px rgba(255,58,58,.15)}
.resTitle{font-family:'Cinzel Decorative',serif;font-size:28px;font-weight:900;margin-bottom:6px}
.resCard.win .resTitle{color:#7effb0;text-shadow:0 0 25px rgba(46,204,113,.9)}
.resCard.lose .resTitle{color:#ff8080;text-shadow:0 0 25px rgba(255,58,58,.9)}
.resSub{font-size:12px;color:#c8b0e8;margin-bottom:12px}
.resAmount{display:inline-block;padding:14px 28px;border-radius:12px;font-family:monospace;font-size:30px;font-weight:900;margin:12px 0;min-width:200px;background:rgba(0,0,0,.5);border:2px solid #ffcc00;color:#fff;text-shadow:0 0 20px #ffcc00}
.resRows{display:flex;flex-direction:column;gap:6px;margin:12px 0 18px}
.resRow{display:flex;justify-content:space-between;padding:8px 14px;background:rgba(255,255,255,.06);border-radius:8px;font-size:12px}
.resRow .lbl{color:#c8b0e8}
.resRow .val{font-family:monospace;font-weight:900;color:#fff}
.resBtn{width:100%;padding:14px;font-family:'Cinzel Decorative',serif;font-size:15px;font-weight:900;border-radius:11px;cursor:pointer;border:3px solid #ffcc00;background:linear-gradient(180deg,#ffcc00,#8a6000);color:#1a0a00;margin-top:10px}
.resBtn:active{transform:scale(.97)}

/* ===== MOBILE ===== */
@media (max-width:640px){
.statBox{min-width:66px;padding:4px 8px}
.statBox b{font-size:12px}
.betDisplay{min-width:100px}
.actionBtn{font-size:13px;padding:13px;min-width:110px}
.lane{height:52px}
.lane-badge{font-size:10px;padding:2px 8px}
#chicken{font-size:36px}
.car{font-size:28px}
#topBtns button{width:38px;height:38px;padding:7px}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs>

<button id="homeBtn"><svg><use href="#ic-home"/></svg></button>

<script>
const $=id=>document.getElementById(id);
const sl=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ AUDIO ============ */
const Aud=(()=>{
let c=null,mg=null,on=true,ready=false;
function init(){if(c)return;try{c=new(window.AudioContext||window.webkitAudioContext)();mg=c.createGain();mg.gain.value=.5;mg.connect(c.destination);ready=true}catch(e){}}
function resume(){if(!c)return;if(c.state==='suspended')c.resume().catch(()=>{})}
function ensure(){if(!c)init();if(c)resume()}
function tone(f,dur,type,vol){if(!on||!ready)return;resume();try{const o=c.createOscillator();o.type=type||'sine';o.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol||.15,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(dur||.1));o.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+(dur||.1)+.02)}catch(e){}}
function click(){tone(800,.06,'square',.06)}
function step(){tone(600,.08,'square',.12);setTimeout(()=>tone(900,.1,'sine',.15),60)}
function crash(){if(!on||!ready)return;resume();try{const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.exponentialRampToValueAtTime(30,c.currentTime+.5);const g=c.createGain();g.gain.setValueAtTime(.5,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+.62);const dur=.4;const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*3);const s=c.createBufferSource();s.buffer=buf;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;const g2=c.createGain();g2.gain.value=.5;s.connect(lp);lp.connect(g2);g2.connect(mg);s.start()}catch(e){}}
function cashout(){if(!on||!ready)return;resume();[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sine',.18),i*70))}
function bigWin(){if(!on||!ready)return;resume();[261.63,329.63,392,523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>setTimeout(()=>tone(f,.5,'sawtooth',.14),i*80))}
function start(){tone(440,.1,'sine',.15);setTimeout(()=>tone(660,.15,'sine',.18),90)}
function toggle(){on=!on;return on}
return{init,resume,ensure,tone,click,step,crash,cashout,bigWin,start,toggle,get on(){return on},get ready(){return ready}};
})();

['click','touchstart','keydown','pointerdown'].forEach(ev=>{
  document.addEventListener(ev,()=>{Aud.ensure()},{once:true});
});

async function api(path,opts={}){
  const token=localStorage.getItem('sc_token');
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  if(token)headers['Authorization']='Bearer '+token;
  const res=await fetch(path,{...opts,headers});
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'خطأ');
  return data;
}
function toast(msg,isErr){const t=$('toast');t.textContent=msg;t.className=isErr?'err on':'on';setTimeout(()=>t.classList.remove('on'),2500)}

/* ============ STATE ============ */
const BETS=[20,50,100,200,500,1000,2000,5000,10000];
const CAR_EMOJIS=['🚗','🚕','🚙','🚌','🚓','🏎️','🚐'];
const S={
  bal:0,bi:2,bet:100,difficulty:1,
  active:false,stepping:false,
  step:0,mult:1,nextMult:1,maxStep:24,
  laneH:60
};

/* Read lane height from CSS (responsive) */
function readLaneH(){
  const test=document.createElement('div');
  test.className='lane';
  test.style.visibility='hidden';
  test.style.position='absolute';
  document.body.appendChild(test);
  const h=test.offsetHeight||60;
  test.remove();
  return h;
}

function computeMultiplier(step,diff){
  const lanes={1:3,2:4,3:5,4:6}[diff]||3;
  let prob=1;
  for(let i=0;i<step;i++)prob*=(lanes-1)/lanes;
  return Math.max(1,Math.floor((0.96/prob)*100)/100);
}

/* ============ BOARD BUILDING ============ */
function buildBoard(){
  S.laneH=readLaneH();
  const board=$('board');
  // Keep only chicken
  const chicken=$('chicken');
  board.innerHTML='';
  board.appendChild(chicken);

  const totalHeight=(S.maxStep+1)*S.laneH+20;
  board.style.height=totalHeight+'px';

  // Start zone at bottom (bottom: 0)
  const startZone=document.createElement('div');
  startZone.className='startZone';
  startZone.style.bottom='0px';
  startZone.style.position='absolute';
  startZone.style.left='0';
  startZone.style.right='0';
  startZone.style.height=S.laneH+'px';
  board.appendChild(startZone);

  // Lanes at bottom = i * laneH, i = 1..24
  for(let i=1;i<=S.maxStep;i++){
    const lane=document.createElement('div');
    lane.className='lane';
    lane.dataset.step=i;
    lane.style.position='absolute';
    lane.style.left='0';
    lane.style.right='0';
    lane.style.height=S.laneH+'px';
    lane.style.bottom=(i*S.laneH)+'px';

    // Multiplier badge
    const badge=document.createElement('div');
    badge.className='lane-badge';
    badge.textContent=computeMultiplier(i,S.difficulty).toFixed(2)+'×';
    lane.appendChild(badge);

    // Add 2-3 cars with random speeds/directions
    const carCount=2+Math.floor(Math.random()*2);
    for(let j=0;j<carCount;j++){
      const car=document.createElement('div');
      car.className='car';
      car.textContent=CAR_EMOJIS[Math.floor(Math.random()*CAR_EMOJIS.length)];
      const dir=Math.random()<0.5?'ltr':'rtl';
      car.classList.add(dir);
      const dur=(2.5+Math.random()*3).toFixed(2);
      car.style.animationDuration=dur+'s';
      car.style.animationDelay=(-Math.random()*5).toFixed(2)+'s';
      // Random vertical slight offset within lane
      car.style.top=(45+Math.random()*10)+'%';
      lane.appendChild(car);
    }

    board.appendChild(lane);
  }

  // Finish zone at top (bottom: 24 * laneH + laneH)
  const finishZone=document.createElement('div');
  finishZone.className='finishZone';
  finishZone.style.position='absolute';
  finishZone.style.left='0';
  finishZone.style.right='0';
  finishZone.style.height=S.laneH+'px';
  finishZone.style.bottom=((S.maxStep+1)*S.laneH)+'px';
  board.appendChild(finishZone);

  // Position chicken at start
  updateChickenPosition(0,false);
}

function updateChickenPosition(step,animate=true){
  const chicken=$('chicken');
  if(!animate)chicken.style.transition='none';
  chicken.style.bottom=(step*S.laneH+10)+'px';
  if(!animate)setTimeout(()=>{chicken.style.transition=''},50);
}

function scrollToChicken(smooth=true){
  const wrap=$('boardWrap');
  const board=$('board');
  const boardH=parseInt(board.style.height)||0;
  const chickenTop=boardH-(S.step*S.laneH+10)-42;
  const target=Math.max(0,chickenTop-wrap.clientHeight/2+40);
  if(smooth){
    wrap.scrollTo({top:target,behavior:'smooth'});
  }else{
    wrap.scrollTop=target;
  }
}

/* ============ STEP ANIMATION ============ */
async function walkChickenTo(targetStep,crash){
  const chicken=$('chicken');
  chicken.classList.add('walking');

  if(crash){
    // Move partway (50%)
    const partway=S.step*S.laneH+S.laneH*0.45+10;
    chicken.style.bottom=partway+'px';
    await sl(220);
  }else{
    // Full move
    chicken.style.bottom=(targetStep*S.laneH+10)+'px';
    await sl(400);
  }

  chicken.classList.remove('walking');
  if(!crash){
    chicken.classList.add('landed');
    setTimeout(()=>chicken.classList.remove('landed'),400);
  }
}

function showCrashCar(step){
  const lane=document.querySelector('.lane[data-step="'+step+'"]');
  if(!lane)return;
  const car=document.createElement('div');
  car.className='car crashCar';
  car.textContent='🚗';
  car.style.top='55%';
  car.style.animation='crashDrive .35s ease-out forwards';
  lane.appendChild(car);
}

function showExplosion(){
  const chicken=$('chicken');
  const chickenBottom=parseInt(chicken.style.bottom)||0;
  const exp=document.createElement('div');
  exp.className='explosion';
  exp.textContent='💥';
  exp.style.left='50%';
  exp.style.bottom=(chickenBottom-10)+'px';
  $('board').appendChild(exp);
  setTimeout(()=>exp.remove(),900);
}

function showDust(){
  const chicken=$('chicken');
  const bottom=parseInt(chicken.style.bottom)||0;
  for(let i=0;i<6;i++){
    const d=document.createElement('div');
    d.className='dust';
    d.textContent=['✨','💫','⭐'][Math.floor(Math.random()*3)];
    d.style.left=(45+Math.random()*10)+'%';
    d.style.bottom=bottom+'px';
    d.style.animationDelay=(i*40)+'ms';
    $('board').appendChild(d);
    setTimeout(()=>d.remove(),1000);
  }
}

function shakeScreen(){
  const g=$('game');
  const st=performance.now();
  (function lp(t){
    const p=(t-st)/500;
    if(p>=1){g.style.transform='';return}
    const a=10*(1-p);
    g.style.transform='translate('+(Math.random()-.5)*a+'px,'+(Math.random()-.5)*a+'px)';
    requestAnimationFrame(lp);
  })(st);
}

/* ============ GAME LOGIC ============ */
function updBal(){$('bal').textContent=Math.floor(S.bal).toLocaleString();const st=JSON.parse(localStorage.getItem('sc_user')||'{}');localStorage.setItem('sc_user',JSON.stringify({...st,balance:S.bal}))}
function updStats(){
  $('sBet').textContent=S.bet;
  $('betVal').textContent=S.bet;
  $('sMult').textContent=S.mult.toFixed(2)+'×';
  $('sStep').textContent=S.step+'/'+S.maxStep;
  $('sCash').textContent=Math.floor(S.bet*S.mult).toLocaleString();
}

async function startGame(){
  if(S.active)return;
  if(S.bal<S.bet){toast('رصيد غير كافٍ',true);return}
  Aud.ensure();Aud.start();
  $('startBtn').disabled=true;
  try{
    const res=await api('/api/chicken/start',{method:'POST',body:JSON.stringify({bet:S.bet,difficulty:S.difficulty})});
    S.bal=res.balance;updBal();
    S.active=true;S.step=0;S.mult=1;
    S.nextMult=res.nextMultiplier||computeMultiplier(1,S.difficulty);
    $('startBtn').style.display='none';
    $('stepBtn').style.display='block';
    $('cashBtn').style.display='none';
    document.querySelectorAll('.diffBtn').forEach(b=>b.disabled=true);
    $('betDown').disabled=true;$('betUp').disabled=true;

    // Build fresh board with correct multipliers
    buildBoard();
    scrollToChicken(false);
    updStats();
    toast('🚗 ابدأ العبور!');
  }catch(e){
    toast(e.message,true);
  }
  $('startBtn').disabled=false;
}

async function doStep(){
  if(!S.active||S.stepping)return;
  S.stepping=true;
  $('stepBtn').disabled=true;
  Aud.ensure();

  const nextStep=S.step+1;

  try{
    const res=await api('/api/chicken/step',{method:'POST'});

    // Mark lane as attempting
    const lane=document.querySelector('.lane[data-step="'+nextStep+'"]');
    if(lane)lane.classList.add('attempting');

    if(res.crashed){
      // CRASH SEQUENCE
      await walkChickenTo(nextStep,true);
      showCrashCar(nextStep);
      Aud.crash();
      await sl(180);
      showExplosion();
      shakeScreen();
      const chicken=$('chicken');
      chicken.classList.add('crashed');
      if(lane){
        lane.classList.remove('attempting');
        lane.classList.add('failed');
      }
      await sl(900);
      showResult(false,0,0);
      resetAfterResult();
      return;
    }

    // SAFE SEQUENCE
    await walkChickenTo(nextStep,false);
    S.step=res.step;
    S.mult=res.multiplier;
    S.nextMult=res.nextMultiplier||computeMultiplier(S.step+1,S.difficulty);
    if(lane){
      lane.classList.remove('attempting');
      lane.classList.add('completed');
    }
    Aud.step();
    showDust();
    updateChickenPosition(S.step,false);
    scrollToChicken(true);
    updStats();
    $('cashBtn').style.display='block';
    $('cashBtn').disabled=false;
    $('cashBtn').textContent='💰 اسحب '+Math.floor(S.bet*S.mult).toLocaleString();

    if(S.step>=S.maxStep){
      await sl(400);
      doCashout();
      return;
    }
    $('stepBtn').disabled=false;
  }catch(e){
    toast(e.message,true);
    $('stepBtn').disabled=false;
  }
  S.stepping=false;
}

async function doCashout(){
  if(!S.active||S.step===0)return;
  $('stepBtn').disabled=true;$('cashBtn').disabled=true;
  try{
    const res=await api('/api/chicken/cashout',{method:'POST'});
    S.bal=res.balance;updBal();
    Aud.cashout();
    if(res.multiplier>=5)setTimeout(()=>Aud.bigWin(),400);
    S.active=false;
    showResult(true,res.amount,res.multiplier);
    resetAfterResult();
  }catch(e){
    toast(e.message,true);
    $('stepBtn').disabled=false;$('cashBtn').disabled=false;
  }
}

function resetAfterResult(){
  S.active=false;S.stepping=false;S.step=0;S.mult=1;
  $('startBtn').style.display='block';
  $('stepBtn').style.display='none';
  $('cashBtn').style.display='none';
  $('stepBtn').disabled=false;
  $('cashBtn').disabled=false;
  document.querySelectorAll('.diffBtn').forEach(b=>b.disabled=false);
  $('betDown').disabled=false;$('betUp').disabled=false;
  buildBoard();
  scrollToChicken(false);
  updStats();
}

function showResult(won,amount,mult){
  const o=$('overlay');const card=$('resCard');
  card.className='resCard '+(won?'win':'lose');
  if(won){
    $('resTitle').textContent='🎉 عبرت بسلام!';
    $('resSub').textContent='وصلت الطابق '+S.step+' بأمان';
    $('resAmount').textContent=Math.floor(amount).toLocaleString()+' ل.س';
    $('resRows').innerHTML=
      '<div class="resRow"><span class="lbl">الرهان</span><span class="val">'+S.bet.toLocaleString()+' ل.س</span></div>'+
      '<div class="resRow"><span class="lbl">المضاعف</span><span class="val">'+mult.toFixed(2)+'×</span></div>'+
      '<div class="resRow"><span class="lbl">الخطوات</span><span class="val">'+S.step+' / '+S.maxStep+'</span></div>'+
      '<div class="resRow"><span class="lbl">صافي الربح</span><span class="val" style="color:#7effb0">+'+(amount-S.bet).toLocaleString()+' ل.س</span></div>';
  }else{
    $('resTitle').textContent='💥 دُهست!';
    $('resSub').textContent='الخطوة '+S.step+' ← '+(S.step+1);
    $('resAmount').textContent='-'+S.bet.toLocaleString()+' ل.س';
    $('resRows').innerHTML=
      '<div class="resRow"><span class="lbl">الرهان</span><span class="val">'+S.bet.toLocaleString()+' ل.س</span></div>'+
      '<div class="resRow"><span class="lbl">وصلت للخطوة</span><span class="val">'+S.step+'</span></div>'+
      '<div class="resRow"><span class="lbl">الصعوبة</span><span class="val">'+['سهل','متوسط','صعب','جنوني'][S.difficulty-1]+'</span></div>';
  }
  o.classList.add('show');
}

$('resBtn').onclick=()=>{
  Aud.ensure();Aud.click();
  $('overlay').classList.remove('show');
  refreshMe();
};

/* ============ BUTTONS ============ */
$('startBtn').onclick=startGame;
$('stepBtn').onclick=doStep;
$('cashBtn').onclick=doCashout;

$('betDown').onclick=()=>{if(S.active)return;Aud.ensure();Aud.click();if(S.bi>0){S.bi--;S.bet=BETS[S.bi];updStats()}};
$('betUp').onclick=()=>{if(S.active)return;Aud.ensure();Aud.click();if(S.bi<BETS.length-1){S.bi++;S.bet=BETS[S.bi];updStats()}};

document.querySelectorAll('.diffBtn').forEach(b=>{
  b.onclick=()=>{
    if(S.active)return;
    Aud.ensure();Aud.click();
    document.querySelectorAll('.diffBtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    S.difficulty=parseInt(b.dataset.d);
    if(!S.active)buildBoard();
  };
});

$('homeBtn').onclick=()=>{if(S.active&&!confirm('لديك لعبة نشطة! هل تريد الخروج؟'))return;location.href='/'};
$('soundBtn').onclick=()=>{const on=Aud.toggle();$('soundIcon').innerHTML='<use href="'+(on?'#ic-sound-on':'#ic-sound-off')+'"/>';if(on){Aud.init();Aud.resume();Aud.click()}};

async function refreshMe(){try{const u=await api('/api/me');S.bal=u.balance;updBal()}catch(e){if(e.message.includes('جلسة')||e.message.includes('مصرح'))location.href='/'}}

/* ============ INIT ============ */
(async()=>{
  const token=localStorage.getItem('sc_token');
  if(!token){location.href='/';return}
  try{
    const u=await api('/api/me');
    S.bal=u.balance;updBal();
    // Small delay to make sure fonts/CSS loaded
    await sl(100);
    buildBoard();
    scrollToChicken(false);
    updStats();
  }catch(e){location.href='/'}
})();

/* Handle resize */
let resizeTimer=null;
addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(!S.active){
      buildBoard();
      scrollToChicken(false);
    }
  },200);
});
</script>
</body>
</html>
