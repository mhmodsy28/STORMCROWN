<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0505">
<title>🐔 طريق الدجاجة — STORMCHICKEN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Amiri:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0505;color:#fff;font-family:'Amiri',serif;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#topBtns{position:fixed;top:6px;left:0;right:0;z-index:60;height:48px;pointer-events:none}
#topBtns button{pointer-events:auto;position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid #ffcc00;background:linear-gradient(180deg,rgba(60,40,10,.95),rgba(20,10,5,.95));cursor:pointer;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 0 15px rgba(255,204,0,.4)}
#topBtns button:active{transform:scale(.9)}
#topBtns button svg{width:100%;height:100%;fill:#ffcc00}
#homeBtn{top:0;left:6px}
#soundBtn{top:0;right:6px}

#balBox{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;background:linear-gradient(180deg,rgba(60,40,10,.95),rgba(20,10,5,.98));border:2px solid #ffcc00;border-radius:10px;padding:4px 16px;text-align:center;box-shadow:0 0 20px rgba(255,204,0,.5)}
#balBox small{display:block;font-size:9px;color:#ffe8a0;font-family:'Cinzel Decorative',serif}
#balBox b{color:#fff;font-family:monospace;font-size:16px;text-shadow:0 0 10px #ffcc00}

#game{position:fixed;inset:0;display:flex;flex-direction:column;padding:52px 0 0 0;background:radial-gradient(ellipse at 50% 0%,#1a0a00 0%,transparent 50%),linear-gradient(180deg,#050810 0%,#0a1525 50%,#050810 100%)}

#stats{display:flex;gap:6px;justify-content:center;padding:8px;flex-shrink:0;flex-wrap:wrap}
.statBox{background:linear-gradient(180deg,rgba(60,40,10,.7),rgba(20,10,5,.9));border:2px solid #ffcc00;border-radius:9px;padding:5px 12px;text-align:center;min-width:78px}
.statBox small{display:block;font-size:8px;color:#ffe8a0;font-family:'Cinzel Decorative',serif;letter-spacing:.05em}
.statBox b{color:#fff;font-family:monospace;font-size:14px;text-shadow:0 0 10px #ffcc00}
.statBox.hot{border-color:#2ecc71;box-shadow:0 0 15px rgba(46,204,113,.5)}
.statBox.hot b{color:#7effb0;text-shadow:0 0 10px #2ecc71}

#lanesWrap{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;padding:6px 10px 6px;scrollbar-width:thin;scrollbar-color:#ffcc00 #1a0a00}
#lanesWrap::-webkit-scrollbar{width:5px}
#lanesWrap::-webkit-scrollbar-track{background:#1a0a00}
#lanesWrap::-webkit-scrollbar-thumb{background:#ffcc00;border-radius:3px}
#lanesInner{display:flex;flex-direction:column-reverse;gap:5px;min-height:100%}

.lane{position:relative;display:flex;align-items:center;gap:8px;min-height:56px;flex-shrink:0}
.laneNum{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:linear-gradient(180deg,#3a2000,#1a0a00);border:2px solid #ffcc00;display:flex;align-items:center;justify-content:center;font-family:monospace;font-weight:900;font-size:14px;color:#ffcc00;z-index:3}
.lane.current .laneNum{background:linear-gradient(180deg,#ffcc00,#8a6000);border-color:#fff;box-shadow:0 0 25px #ffcc00;color:#1a0a00;animation:lanePulse 1.2s ease-in-out infinite}
@keyframes lanePulse{0%,100%{box-shadow:0 0 20px #ffcc00}50%{box-shadow:0 0 35px #ffcc00,0 0 55px rgba(255,204,0,.6)}}
.lane.passed .laneNum{background:linear-gradient(180deg,#2ecc71,#0a5a2a);border-color:#7effb0;color:#fff}
.lane.failed .laneNum{background:linear-gradient(180deg,#8b0000,#3a0000);border-color:#ff3a3a;color:#fff}

.track{flex:1;height:52px;border-radius:9px;background:linear-gradient(180deg,#2a2520,#1a1515,#2a2520);position:relative;overflow:hidden;border:2px solid #3a3020;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
.track::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,#ffcc00 0,#ffcc00 12px,transparent 12px,transparent 24px);opacity:.4;transform:translateY(-50%);z-index:1}
.track.passed{background:linear-gradient(180deg,#0a5a2a,#0a3a1a,#0a5a2a);border-color:#2ecc71}
.track.passed::before{background:repeating-linear-gradient(90deg,#7effb0 0,#7effb0 12px,transparent 12px,transparent 24px)}
.track.failed{background:linear-gradient(180deg,#5a0a0a,#3a0000,#5a0a0a);border-color:#ff3a3a}
.track.failed::before{background:repeating-linear-gradient(90deg,#ff8080 0,#ff8080 12px,transparent 12px,transparent 24px)}

.car{position:absolute;font-size:26px;top:50%;transform:translateY(-50%);z-index:2;filter:drop-shadow(0 0 6px rgba(255,255,255,.4));pointer-events:none;line-height:1}
.car.ltr{animation:carLTR .9s linear forwards}
.car.rtl{animation:carRTL .9s linear forwards}
@keyframes carLTR{0%{left:-15%;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:110%;opacity:0}}
@keyframes carRTL{0%{left:110%;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:-15%;opacity:0}}

.chickenIcon{position:absolute;top:50%;transform:translateY(-50%);font-size:32px;z-index:4;filter:drop-shadow(0 0 10px #ffcc00);transition:left .35s cubic-bezier(.4,1.6,.5,1);left:50%}
.chickenIcon.right{left:calc(100% - 40px)}
.chickenIcon.moving-left{animation:hopLeft .35s ease}
.chickenIcon.moving-right{animation:hopRight .35s ease}
@keyframes hopLeft{0%{left:50%}50%{top:30%}100%{left:15%}}
@keyframes hopRight{0%{left:50%}50%{top:30%}100%{left:calc(100% - 40px)}}

.multBadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:monospace;font-size:11px;font-weight:900;color:#ffe8a0;background:rgba(0,0,0,.75);border:1px solid #ffcc00;border-radius:20px;padding:2px 12px;z-index:5;letter-spacing:.5px}
.lane.passed .multBadge{background:linear-gradient(180deg,#2ecc71,#0a5a2a);color:#fff;border-color:#7effb0;box-shadow:0 0 12px rgba(46,204,113,.7)}
.lane.current .multBadge{background:linear-gradient(180deg,#ffcc00,#8a6000);color:#1a0a00;border-color:#fff;box-shadow:0 0 15px rgba(255,204,0,.8)}

.lane.startLane .laneNum{background:linear-gradient(180deg,#4a9eff,#1a3a8a);border-color:#8ec8ff}
.lane.startLane .track{background:linear-gradient(180deg,#1a2a4a,#0a1525,#1a2a4a);border-color:#4a9eff}

#ctrlBar{flex-shrink:0;background:linear-gradient(180deg,rgba(10,5,15,.98),rgba(5,0,10,.99));border-top:2px solid #ffcc00;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 40px rgba(255,204,0,.15)}

.diffRow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.diffBtn{padding:7px 10px;font-family:'Amiri',serif;font-weight:700;font-size:11px;border-radius:8px;cursor:pointer;border:2px solid #ffcc00;background:linear-gradient(180deg,rgba(60,40,10,.6),rgba(20,10,5,.9));color:#ffe8a0;transition:all .15s}
.diffBtn.active{background:linear-gradient(180deg,#ffcc00,#8a6000);color:#1a0a00;box-shadow:0 0 18px rgba(255,204,0,.7)}
.diffBtn:active{transform:scale(.94)}
.diffBtn:disabled{opacity:.5;cursor:not-allowed}

.betRow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.betBtn{padding:8px 14px;font-family:'Amiri',serif;font-weight:700;font-size:14px;border-radius:9px;cursor:pointer;border:2px solid #ffcc00;background:linear-gradient(180deg,rgba(60,40,10,.95),rgba(20,10,5,.98));color:#ffe8a0;min-width:44px}
.betBtn:active{transform:scale(.94)}
.betBtn:disabled{opacity:.4;cursor:not-allowed}
.betDisplay{background:rgba(5,15,30,.9);border:2px solid #ffcc00;padding:6px 16px;border-radius:10px;text-align:center;min-width:130px}
.betDisplay small{display:block;font-size:9px;color:#ffe8a0;font-family:'Cinzel Decorative',serif}
.betDisplay b{color:#fff;font-family:monospace;font-size:16px;text-shadow:0 0 10px #ffcc00}

.actionRow{display:flex;gap:8px;justify-content:center}
.actionBtn{flex:1;max-width:290px;padding:15px;font-family:'Cinzel Decorative',serif;font-size:15px;font-weight:900;border-radius:12px;cursor:pointer;border:3px solid;letter-spacing:.05em;transition:all .15s;min-width:130px}
.actionBtn:active{transform:scale(.97)}
.actionBtn:disabled{opacity:.5;cursor:not-allowed}
#startBtn{background:linear-gradient(180deg,#1a5a2a,#0a3015);border-color:#2ecc71;color:#d0ffe0;box-shadow:0 0 25px rgba(46,204,113,.5)}
#stepBtn{background:linear-gradient(180deg,#c9a000,#6a5000);border-color:#ffcc00;color:#fff;box-shadow:0 0 25px rgba(255,204,0,.6)}
#cashBtn{background:linear-gradient(180deg,#c94000,#6a1a00);border-color:#ff8c00;color:#fff;box-shadow:0 0 30px rgba(255,140,0,.6);animation:cashPulse .7s ease-in-out infinite alternate}
@keyframes cashPulse{to{box-shadow:0 0 45px rgba(255,140,0,.9)}}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(180deg,#2ecc71,#00a050);color:#fff;padding:10px 18px;border-radius:8px;font-weight:bold;z-index:9999;transition:transform .3s;font-size:12px;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:linear-gradient(180deg,#ff4a4a,#8b0000)}

#overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.9);backdrop-filter:blur(6px)}
#overlay.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.resCard{width:100%;max-width:420px;padding:26px;border-radius:18px;text-align:center;animation:pop .5s cubic-bezier(.19,1.6,.3,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.resCard.win{background:linear-gradient(180deg,#1a5a3a,#0a2015);border:3px solid #2ecc71;box-shadow:0 0 80px rgba(46,204,113,.7)}
.resCard.lose{background:linear-gradient(180deg,#5a0a0a,#1a0000);border:3px solid #ff3a3a;box-shadow:0 0 80px rgba(255,58,58,.7)}
.resTitle{font-family:'Cinzel Decorative',serif;font-size:28px;font-weight:900;margin-bottom:6px}
.resCard.win .resTitle{color:#7effb0;text-shadow:0 0 25px rgba(46,204,113,.9)}
.resCard.lose .resTitle{color:#ff8080;text-shadow:0 0 25px rgba(255,58,58,.9)}
.resAmount{display:inline-block;padding:14px 28px;border-radius:12px;font-family:monospace;font-size:30px;font-weight:900;margin:14px 0;min-width:200px;background:rgba(0,0,0,.5);border:2px solid #ffcc00;color:#fff;text-shadow:0 0 20px #ffcc00}
.resBtn{width:100%;padding:14px;font-family:'Cinzel Decorative',serif;font-size:15px;font-weight:900;border-radius:11px;cursor:pointer;border:3px solid #ffcc00;background:linear-gradient(180deg,#ffcc00,#8a6000);color:#1a0a00;margin-top:10px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ic-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
<symbol id="ic-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
<symbol id="ic-sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 4v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
</defs></svg>

<div id="topBtns">
<button id="homeBtn"><svg><use href="#ic-home"/></svg></button>
<button id="soundBtn"><svg id="soundIcon"><use href="#ic-sound-on"/></svg></button>
</div>
<div id="balBox"><small>الرصيد</small><b id="bal">0</b></div>

<div id="game">
<div id="stats">
<div class="statBox"><small>الرهان</small><b id="sBet">100</b></div>
<div class="statBox hot"><small>المضاعف</small><b id="sMult">1.00×</b></div>
<div class="statBox"><small>الخطوة</small><b id="sStep">0/24</b></div>
<div class="statBox hot"><small>الجائزة</small><b id="sCash">0</b></div>
</div>

<div id="lanesWrap"><div id="lanesInner"></div></div>

<div id="ctrlBar">
<div class="diffRow" id="diffRow">
<div class="diffBtn active" data-d="1">🟢 سهل</div>
<div class="diffBtn" data-d="2">🟡 متوسط</div>
<div class="diffBtn" data-d="3">🟠 صعب</div>
<div class="diffBtn" data-d="4">🔴 جنوني</div>
</div>
<div class="betRow">
<button class="betBtn" id="betDown">−</button>
<div class="betDisplay"><small>الرهان</small><b id="betVal">100</b></div>
<button class="betBtn" id="betUp">+</button>
</div>
<div class="actionRow">
<button class="actionBtn" id="startBtn">🚗 ابدأ العبور</button>
<button class="actionBtn" id="stepBtn" style="display:none">➡️ تقدّم خطوة</button>
<button class="actionBtn" id="cashBtn" style="display:none">💰 اسحب</button>
</div>
</div>
</div>

<div id="overlay"><div class="resCard" id="resCard">
<div class="resTitle" id="resTitle">🎉</div>
<div class="resAmount" id="resAmount">0</div>
<button class="resBtn" id="resBtn">جولة جديدة</button>
</div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const sl=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ AUDIO ============ */
const Aud=(()=>{
let c=null,mg=null,on=true,ready=false;
function init(){if(c)return;try{c=new(window.AudioContext||window.webkitAudioContext)();mg=c.createGain();mg.gain.value=.5;mg.connect(c.destination);ready=true}catch(e){}}
function resume(){if(!c)return;if(c.state==='suspended')c.resume().catch(()=>{})}
function tone(f,dur=.15,type='sine',vol=.2){if(!on||!ready)return;resume();try{const o=c.createOscillator();o.type=type;o.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+dur+.02)}catch(e){}}
function step(){if(!on||!ready)return;tone(600,.08,'square',.1);setTimeout(()=>tone(900,.1,'sine',.15),60)}
function crash(){if(!on||!ready)return;resume();try{const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(180,c.currentTime);o.frequency.exponentialRampToValueAtTime(30,c.currentTime+.5);const g=c.createGain();g.gain.setValueAtTime(.4,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+.62);const dur=.4;const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*3);const s=c.createBufferSource();s.buffer=buf;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;const g2=c.createGain();g2.gain.value=.4;s.connect(lp);lp.connect(g2);g2.connect(mg);s.start()}catch(e){}}
function cashout(){if(!on||!ready)return;resume();[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{setTimeout(()=>tone(f,.25,'sine',.18),i*70)})}
function start(){if(!on||!ready)return;resume();tone(440,.1,'sine',.15);setTimeout(()=>tone(660,.15,'sine',.18),90)}
function bigWin(){if(!on||!ready)return;resume();[261.63,329.63,392,523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{setTimeout(()=>tone(f,.4,'sawtooth',.15),i*80)})}
function toggle(){on=!on;return on}
return{init,resume,tone,step,crash,cashout,start,bigWin,toggle,get on(){return on},get ready(){return ready}};
})();

async function api(path,opts={}){const token=localStorage.getItem('sc_token');const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers['Authorization']='Bearer '+token;const res=await fetch(path,{...opts,headers});const data=await res.json();if(!res.ok)throw new Error(data.error||'خطأ');return data}
function toast(msg,isErr){const t=$('toast');t.textContent=msg;t.className=isErr?'err on':'on';setTimeout(()=>t.classList.remove('on'),2500)}

const BETS=[20,50,100,200,500,1000,2000,5000,10000];
const S={bal:0,bi:2,bet:100,difficulty:1,active:false,step:0,mult:1,nextMult:1,maxStep:24};
const CARS=['🚗','🚕','🚙','🚌','🚓','🏎️'];

function computeMultiplier(step,diff){
  const lanes={1:3,2:4,3:5,4:6}[diff];
  let prob=1;
  for(let i=0;i<step;i++) prob*=(lanes-1)/lanes;
  return Math.max(1,Math.floor((0.96/prob)*100)/100);
}

function updBal(){$('bal').textContent=Math.floor(S.bal).toLocaleString();const st=JSON.parse(localStorage.getItem('sc_user')||'{}');localStorage.setItem('sc_user',JSON.stringify({...st,balance:S.bal}))}
function updStats(){$('sBet').textContent=S.bet;$('betVal').textContent=S.bet;$('sMult').textContent=S.mult.toFixed(2)+'×';$('sStep').textContent=S.step+'/'+S.maxStep;$('sCash').textContent=Math.floor(S.bet*S.mult).toLocaleString()}

function buildLanes(){
  const inner=$('lanesInner');inner.innerHTML='';
  for(let i=1;i<=S.maxStep;i++){
    const lane=document.createElement('div');
    lane.className='lane';
    lane.dataset.step=i;
    const mult=computeMultiplier(i,S.difficulty);
    lane.innerHTML='<div class="laneNum">'+i+'</div><div class="track"><span class="multBadge">'+mult.toFixed(2)+'×</span></div>';
    inner.appendChild(lane);
  }
  // START lane at bottom
  const start=document.createElement('div');
  start.className='lane startLane';
  start.dataset.step=0;
  start.innerHTML='<div class="laneNum">🏁</div><div class="track"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:11px;color:#8ec8ff;font-family:monospace">START</span><span class="chickenIcon">🐔</span></div>';
  inner.appendChild(start);
}

function updateLaneVisuals(){
  document.querySelectorAll('.lane').forEach(l=>{
    const s=parseInt(l.dataset.step);
    l.classList.remove('current','passed','failed');
    const chicken=l.querySelector('.chickenIcon');
    if(chicken) chicken.remove();
    const cars=l.querySelectorAll('.car');
    cars.forEach(c=>c.remove());
    if(s>0&&s<=S.step) l.classList.add('passed');
    if(s===S.step&&S.active) l.classList.add('current');
    if(s===S.step&&S.active){
      const track=l.querySelector('.track');
      const ch=document.createElement('div');
      ch.className='chickenIcon';
      ch.textContent='🐔';
      track.appendChild(ch);
    }
  });
  const startLane=document.querySelector('.lane[data-step="0"]');
  if(startLane&&S.step===0){
    const track=startLane.querySelector('.track');
    if(!track.querySelector('.chickenIcon')){
      const ch=document.createElement('div');
      ch.className='chickenIcon';
      ch.textContent='🐔';
      track.appendChild(ch);
    }
  }
  // scroll to current
  const cur=document.querySelector('.lane[data-step="'+S.step+'"]');
  if(cur) cur.scrollIntoView({behavior:'smooth',block:'center'});
}

async function animateCars(step,dir='ltr'){
  const lane=document.querySelector('.lane[data-step="'+step+'"]');
  if(!lane) return;
  const track=lane.querySelector('.track');
  const car=document.createElement('div');
  car.className='car '+dir;
  car.textContent=CARS[Math.floor(Math.random()*CARS.length)];
  if(dir==='rtl') car.style.transform='translateY(-50%) scaleX(-1)';
  track.appendChild(car);
  Aud.tone(dir==='ltr'?200:220,.2,'sawtooth',.08);
  await sl(900);
  car.remove();
}

async function startGame(){
  if(S.active) return;
  if(S.bal<S.bet){toast('رصيد غير كافٍ',true);return}
  Aud.init();Aud.resume();Aud.start();
  $('startBtn').disabled=true;
  try{
    const res=await api('/api/chicken/start',{method:'POST',body:JSON.stringify({bet:S.bet,difficulty:S.difficulty})});
    S.bal=res.balance;updBal();
    S.active=true;S.step=0;S.mult=1;S.nextMult=res.nextMultiplier||computeMultiplier(1,S.difficulty);
    $('startBtn').style.display='none';
    $('stepBtn').style.display='block';
    $('cashBtn').style.display='none';
    $('diffRow').querySelectorAll('.diffBtn').forEach(b=>b.disabled=true);
    $('betDown').disabled=true;$('betUp').disabled=true;
    buildLanes();updateLaneVisuals();updStats();
    toast('🚗 ابدأ العبور!');
  }catch(e){toast(e.message,true)}
  $('startBtn').disabled=false;
}

async function doStep(){
  if(!S.active) return;
  $('stepBtn').disabled=true;
  const nextStep=S.step+1;
  const dir=Math.random()<.5?'ltr':'rtl';
  await animateCars(nextStep,dir);
  try{
    const res=await api('/api/chicken/step',{method:'POST'});
    if(res.crashed){
      Aud.crash();
      S.active=false;
      // show failed lane
      const lane=document.querySelector('.lane[data-step="'+nextStep+'"]');
      if(lane){lane.classList.add('failed');const track=lane.querySelector('.track');track.classList.add('failed');const ch=document.createElement('div');ch.className='chickenIcon';ch.textContent='💥';ch.style.left='50%';track.appendChild(ch)}
      await sl(600);
      showResult(false,0,S.step,S.mult);
      resetAfterResult();
      return;
    }
    S.step=res.step;
    S.mult=res.multiplier;
    S.nextMult=res.nextMultiplier||computeMultiplier(S.step+1,S.difficulty);
    Aud.step();
    updateLaneVisuals();
    updStats();
    $('cashBtn').style.display='block';
    $('cashBtn').textContent='💰 اسحب '+Math.floor(S.bet*S.mult).toLocaleString();
    if(S.step>=S.maxStep){
      // auto cashout at end
      await sl(400);
      doCashout();
      return;
    }
  }catch(e){toast(e.message,true)}
  $('stepBtn').disabled=false;
}

async function doCashout(){
  if(!S.active||S.step===0) return;
  $('stepBtn').disabled=true;$('cashBtn').disabled=true;
  try{
    const res=await api('/api/chicken/cashout',{method:'POST'});
    S.bal=res.balance;updBal();
    Aud.cashout();
    if(res.multiplier>=5) Aud.bigWin();
    S.active=false;
    showResult(true,res.amount,res.step,res.multiplier);
    resetAfterResult();
  }catch(e){toast(e.message,true);$('stepBtn').disabled=false;$('cashBtn').disabled=false}
}

function resetAfterResult(){
  S.active=false;S.step=0;S.mult=1;
  $('startBtn').style.display='block';
  $('stepBtn').style.display='none';
  $('cashBtn').style.display='none';
  $('cashBtn').disabled=false;
  $('diffRow').querySelectorAll('.diffBtn').forEach(b=>b.disabled=false);
  $('betDown').disabled=false;$('betUp').disabled=false;
  buildLanes();updStats();
}

function showResult(won,amount,step,mult){
  const o=$('overlay');const card=$('resCard');
  card.className='resCard '+(won?'win':'lose');
  if(won){
    $('resTitle').textContent='🎉 نجوت!';
    $('resAmount').textContent=Math.floor(amount).toLocaleString()+' ل.س';
  } else {
    $('resTitle').textContent='💥 دُهست!';
    $('resAmount').textContent='-'+S.bet.toLocaleString()+' ل.س';
  }
  o.classList.add('show');
}

$('resBtn').onclick=()=>{$('overlay').classList.remove('show');refreshMe()};

$('startBtn').onclick=startGame;
$('stepBtn').onclick=doStep;
$('cashBtn').onclick=doCashout;

$('betDown').onclick=()=>{if(S.active)return;if(S.bi>0){S.bi--;S.bet=BETS[S.bi];updStats()}};
$('betUp').onclick=()=>{if(S.active)return;if(S.bi<BETS.length-1){S.bi++;S.bet=BETS[S.bi];updStats()}};

document.querySelectorAll('.diffBtn').forEach(b=>{
  b.onclick=()=>{
    if(S.active)return;
    document.querySelectorAll('.diffBtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    S.difficulty=parseInt(b.dataset.d);
    buildLanes();updStats();
  };
});

$('homeBtn').onclick=()=>{if(S.active&&!confirm('لديك لعبة نشطة!'))return;location.href='/'};
$('soundBtn').onclick=()=>{const on=Aud.toggle();$('soundIcon').innerHTML='<use href="'+(on?'#ic-sound-on':'#ic-sound-off')+'"/>';if(on){Aud.init();Aud.resume()}};

async function refreshMe(){try{const u=await api('/api/me');S.bal=u.balance;updBal()}catch(e){if(e.message.includes('جلسة')||e.message.includes('مصرح'))location.href='/'}}

/* فتح الصوت عند أول لمسة */
['click','touchstart','keydown'].forEach(ev=>{
  document.addEventListener(ev,()=>{Aud.init();Aud.resume()},{once:true});
});

(async()=>{
  const token=localStorage.getItem('sc_token');
  if(!token){location.href='/';return}
  try{const u=await api('/api/me');S.bal=u.balance;updBal();buildLanes();updStats()}catch(e){location.href='/'}
})();
</script>
</body>
</html>
