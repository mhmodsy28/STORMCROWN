<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Amiri:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0015;color:#fff;font-family:'Amiri',serif;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

#topBtns{position:fixed;top:6px;left:0;right:0;z-index:60;height:48px;pointer-events:none}
#topBtns button{pointer-events:auto;position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid #9b59ff;background:linear-gradient(180deg,rgba(80,20,150,.95),rgba(20,5,40,.95));cursor:pointer;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:0 0 15px rgba(155,89,255,.4)}
#topBtns button:active{transform:scale(.9)}
#topBtns button svg{width:100%;height:100%;fill:#c89bff}
#homeBtn{top:0;left:6px}
#soundBtn{top:0;right:6px}

#balBox{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;background:linear-gradient(180deg,rgba(80,20,150,.95),rgba(20,5,40,.98));border:2px solid #9b59ff;border-radius:10px;padding:4px 16px;text-align:center;box-shadow:0 0 20px rgba(155,89,255,.5)}
#balBox small{display:block;font-size:9px;color:#c89bff;font-family:'Cinzel Decorative',serif}
#balBox b{color:#fff;font-family:monospace;font-size:16px;text-shadow:0 0 10px #9b59ff}

#game{position:fixed;inset:0;display:flex;flex-direction:column;padding:52px 0 0 0;background:radial-gradient(ellipse at 50% 0%,#3a0a6a 0%,transparent 50%),radial-gradient(ellipse at 50% 100%,#1a0040 0%,transparent 50%),linear-gradient(180deg,#0a0015 0%,#150030 50%,#0a0015 100%)}

#stats{display:flex;gap:6px;justify-content:center;padding:8px 10px;flex-shrink:0;flex-wrap:wrap}
.statBox{background:linear-gradient(180deg,rgba(80,20,150,.5),rgba(20,5,40,.85));border:2px solid #9b59ff;border-radius:9px;padding:5px 12px;text-align:center;min-width:78px}
.statBox small{display:block;font-size:8px;color:#c89bff;font-family:'Cinzel Decorative',serif;letter-spacing:.05em}
.statBox b{color:#fff;font-family:monospace;font-size:14px;text-shadow:0 0 10px #9b59ff}
.statBox.hot{border-color:#ffd24a;box-shadow:0 0 15px rgba(255,210,74,.5)}
.statBox.hot b{color:#ffd24a;text-shadow:0 0 10px #ffd24a}

#boardWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px;overflow:hidden}

#ctrlBar{flex-shrink:0;background:linear-gradient(180deg,rgba(20,0,40,.98),rgba(10,0,25,.99));border-top:2px solid #9b59ff;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 40px rgba(155,89,255,.2)}

.optRow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.optBtn{padding:7px 12px;font-family:'Amiri',serif;font-weight:700;font-size:11px;border-radius:8px;cursor:pointer;border:2px solid #9b59ff;background:linear-gradient(180deg,rgba(80,20,150,.5),rgba(20,5,40,.85));color:#c89bff;transition:all .15s}
.optBtn.active{background:linear-gradient(180deg,#9b59ff,#4a1a8a);color:#fff;box-shadow:0 0 18px rgba(155,89,255,.7)}
.optBtn:active{transform:scale(.94)}
.optBtn:disabled{opacity:.5;cursor:not-allowed}

.betRow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.betBtn{padding:8px 14px;font-family:'Amiri',serif;font-weight:700;font-size:14px;border-radius:9px;cursor:pointer;border:2px solid #9b59ff;background:linear-gradient(180deg,rgba(80,20,150,.95),rgba(20,5,40,.98));color:#c89bff;min-width:44px}
.betBtn:active{transform:scale(.94)}
.betBtn:disabled{opacity:.4;cursor:not-allowed}
.betDisplay{background:rgba(10,0,30,.9);border:2px solid #9b59ff;padding:6px 16px;border-radius:10px;text-align:center;min-width:120px}
.betDisplay small{display:block;font-size:9px;color:#c89bff;font-family:'Cinzel Decorative',serif}
.betDisplay b{color:#fff;font-family:monospace;font-size:16px;text-shadow:0 0 10px #9b59ff}

#dropBtn{width:100%;max-width:340px;margin:0 auto;padding:16px;font-family:'Cinzel Decorative',serif;font-size:16px;font-weight:900;border-radius:12px;cursor:pointer;border:3px solid #ffd24a;background:linear-gradient(180deg,#9b59ff,#4a1a8a);color:#fff;letter-spacing:.05em;box-shadow:0 0 30px rgba(155,89,255,.6);transition:all .15s}
#dropBtn:active{transform:scale(.97)}
#dropBtn:disabled{opacity:.5;cursor:not-allowed}
#dropBtn:not(:disabled):hover{box-shadow:0 0 50px rgba(155,89,255,1)}

#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(180deg,#2ecc71,#00a050);color:#fff;padding:10px 18px;border-radius:8px;font-weight:bold;z-index:9999;transition:transform .3s;font-size:12px;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:linear-gradient(180deg,#ff4a4a,#8b0000)}

#winFloat{position:fixed;pointer-events:none;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:22px;z-index:100;text-shadow:0 0 15px currentColor;animation:floatUp 1.5s ease-out forwards}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.3);opacity:1}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-150%) scale(.9);opacity:0}}

@media (max-width:640px){
.statBox{min-width:66px;padding:4px 8px}
.statBox b{font-size:12px}
.betDisplay{min-width:100px}
#dropBtn{font-size:14px;padding:13px}
}

<script>
const $=id=>document.getElementById(id);
const sl=ms=>new Promise(r=>setTimeout(r,ms));

/* ============ AUDIO ============ */
const Aud=(()=>{
let c=null,mg=null,on=true,ready=false;
function init(){if(c)return;try{c=new(window.AudioContext||window.webkitAudioContext)();mg=c.createGain();mg.gain.value=.4;mg.connect(c.destination);ready=true}catch(e){}}
function resume(){if(!c)return;if(c.state==='suspended')c.resume().catch(()=>{})}
function ensure(){if(!c)init();if(c)resume()}
function tone(f,dur,type,vol){if(!on||!ready)return;resume();try{const o=c.createOscillator();o.type=type||'sine';o.frequency.value=f;const g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vol||.15,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(dur||.1));o.connect(g);g.connect(mg);o.start();o.stop(c.currentTime+(dur||.1)+.02)}catch(e){}}
function pegHit(){tone(700+Math.random()*400,.05,'square',.06)}
function land(){tone(600,.15,'sine',.2);setTimeout(()=>tone(900,.15,'sine',.15),80)}
function winSound(level){const notes=[523.25,659.25,783.99,1046.5,1318.5,1567.98,2093];const n=Math.min(level,notes.length);for(let i=0;i<n;i++)setTimeout(()=>tone(notes[i],.3,'sine',.18),i*70)}
function bigWinSound(){[261.63,329.63,392,523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i)=>setTimeout(()=>tone(f,.5,'sawtooth',.14),i*80))}
function dropSound(){tone(300,.12,'sine',.15);setTimeout(()=>tone(500,.1,'sine',.12),60)}
function toggle(){on=!on;return on}
return{init,resume,ensure,tone,pegHit,land,winSound,bigWinSound,dropSound,toggle,get on(){return on},get ready(){return ready}};
})();

['click','touchstart','keydown','pointerdown'].forEach(ev=>{
  document.addEventListener(ev,()=>{Aud.ensure()},{once:true});
});

async function api(path,opts={}){
  const token=localStorage.getItem('sc_token');
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  if(token)headers['Authorization']='Bearer '+token;
  const res=await fetch(path,{...opts,headers});
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'خطأ');
  return data;
}
function toast(msg,isErr){const t=$('toast');t.textContent=msg;t.className=isErr?'err on':'on';setTimeout(()=>t.classList.remove('on'),2500)}

const BETS=[20,50,100,200,500,1000,2000,5000,10000];
const S={bal:0,bi:2,bet:100,risk:'medium',rows:12,dropping:false,lastWin:0};

/* جدول الأرباح الرسمي */
const PAYOUT_TABLE={
  low:{8:[5.6,2.1,1.1,1.0,0.5,1.0,1.1,2.1,5.6],12:[8.1,3,1.6,1.4,1.1,1.0,0.5,1.0,1.1,1.4,1.6,3,8.1],16:[16,9,2,1.4,1.4,1.2,1.1,1.0,0.5,1.0,1.1,1.2,1.4,1.4,2,9,16]},
  medium:{8:[13,3,1.3,0.7,0.4,0.7,1.3,3,13],12:[24,5.5,3,1.6,1.3,1.1,0.6,1.1,1.3,1.6,3,5.5,24],16:[110,41,10,5,3,1.5,1,0.5,0.3,0.5,1,1.5,3,5,10,41,110]},
  high:{8:[29,4,1.5,0.3,0.2,0.3,1.5,4,29],12:[76,18,5,3,1.8,0.9,0.4,0.9,1.8,3,5,18,76],16:[420,130,26,9,4,2,0.9,0.4,0.2,0.4,0.9,2,4,9,26,130,420]}
};
function getPayouts(rows,risk){const t=PAYOUT_TABLE[risk]||PAYOUT_TABLE.medium;return t[rows]||t[12]}

function colorForMult(m){
  if(m>=50) return ['#ff2a2a','#8b0000','#ff8080'];
  if(m>=10) return ['#ffd24a','#8b4000','#fff8e0'];
  if(m>=4)  return ['#ff8c00','#4a1a00','#ffd0a0'];
  if(m>=2)  return ['#c89bff','#4a1a8a','#e0d0ff'];
  if(m>=1)  return ['#4a9eff','#1a3a8a','#8ec8ff'];
  if(m>=0.5)return ['#2ecc71','#0a4a20','#7effb0'];
  return ['#7a2020','#2a0000','#ff8080'];
}

/* ============ CANVAS SETUP ============ */
const cvs=$('boardCanvas');
const ctx=cvs.getContext('2d');
let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
let pegs=[];
let slots=[];
let balls=[];
let pegFlashes=new Map();
let boardReady=false;

function buildBoard(){
  pegs=[];
  slots=[];
  const topPad=H*0.08;
  const botPad=H*0.16;
  const usableH=H-topPad-botPad;
  const rowGap=usableH/S.rows;

  const pegR=Math.max(2.5,W*0.0065);
  const rowWidth=W*0.82;

  for(let r=0;r<S.rows;r++){
    const y=topPad+r*rowGap+rowGap*0.5;
    const count=r+3;
    const gap=rowWidth/(count-1);
    const startX=(W-rowWidth)/2;
    for(let i=0;i<count;i++){
      pegs.push({x:startX+i*gap,y,r:pegR,row:r,col:i});
    }
  }

  const slotCount=S.rows+1;
  const slotWidth=W*0.9;
  const sw=slotWidth/slotCount;
  const startX=(W-slotWidth)/2;
  const slotY=H-botPad+botPad*0.1;
  const slotH=botPad*0.82;
  const payouts=getPayouts(S.rows,S.risk);
  for(let i=0;i<slotCount;i++){
    slots.push({
      x:startX+sw*i+sw/2,
      y:slotY+slotH/2,
      w:sw*0.9,
      h:slotH,
      mult:payouts[i]||1,
      index:i
    });
  }
  boardReady=true;
}

function resizeBoard(){
  const wrap=$('boardWrap');
  const w=wrap.clientWidth;
  const h=wrap.clientHeight;
  const size=Math.max(200,Math.min(w-8,h-8));
  cvs.width=size*DPR;
  cvs.height=size*DPR;
  cvs.style.width=size+'px';
  cvs.style.height=size+'px';
  W=size;H=size;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildBoard();
}
addEventListener('resize',()=>setTimeout(resizeBoard,60));

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============ DRAW ============ */
function drawBoard(){
  if(!boardReady) return;

  // Decay flashes
  for(const [k,v] of pegFlashes){
    const nv=v-.12;
    if(nv<=0)pegFlashes.delete(k);
    else pegFlashes.set(k,nv);
  }

  ctx.clearRect(0,0,W,H);

  // Background
  const bg=ctx.createRadialGradient(W/2,H*0.3,0,W/2,H*0.3,W);
  bg.addColorStop(0,'rgba(80,20,150,.15)');
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Draw decorative lines between pegs
  ctx.strokeStyle='rgba(155,89,255,.06)';
  ctx.lineWidth=1;
  for(let r=0;r<S.rows-1;r++){
    const row1=pegs.filter(p=>p.row===r);
    const row2=pegs.filter(p=>p.row===r+1);
    for(let i=0;i<row1.length;i++){
      if(row2[i]){ctx.beginPath();ctx.moveTo(row1[i].x,row1[i].y);ctx.lineTo(row2[i].x,row2[i].y);ctx.stroke()}
      if(row2[i+1]){ctx.beginPath();ctx.moveTo(row1[i].x,row1[i].y);ctx.lineTo(row2[i+1].x,row2[i+1].y);ctx.stroke()}
    }
  }

  // Draw pegs
  for(const p of pegs){
    const flash=pegFlashes.get(p.row+'_'+p.col)||0;
    if(flash>0){
      ctx.shadowColor='#ffd24a';
      ctx.shadowBlur=25*flash;
      ctx.fillStyle='#ffd24a';
    }else{
      ctx.shadowColor='rgba(200,155,255,.7)';
      ctx.shadowBlur=8;
      ctx.fillStyle='#c89bff';
    }
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*(1+flash*.7),0,Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur=0;

  // Draw slots
  for(const s of slots){
    const col=colorForMult(s.mult);
    const grad=ctx.createLinearGradient(s.x-s.w/2,s.y-s.h/2,s.x-s.w/2,s.y+s.h/2);
    grad.addColorStop(0,col[0]);
    grad.addColorStop(1,col[1]);
    ctx.fillStyle=grad;
    roundRect(s.x-s.w/2,s.y-s.h/2,s.w,s.h,Math.min(s.w,s.h)*0.2);
    ctx.fill();
    ctx.strokeStyle=col[2];
    ctx.lineWidth=1.5;
    roundRect(s.x-s.w/2,s.y-s.h/2,s.w,s.h,Math.min(s.w,s.h)*0.2);
    ctx.stroke();

    // Label
    ctx.shadowColor=col[0];
    ctx.shadowBlur=10;
    ctx.fillStyle=col[2];
    ctx.font='900 '+Math.max(9,Math.min(14,s.w*0.35))+'px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(s.mult>=1?s.mult+'×':s.mult.toFixed(1)+'×',s.x,s.y);
    ctx.shadowBlur=0;
  }

  // Draw balls
  for(const b of balls){
    // Trail
    for(let i=0;i<b.trail.length;i++){
      const t=b.trail[i];
      const alpha=(i/Math.max(1,b.trail.length))*0.5;
      ctx.globalAlpha=alpha;
      ctx.fillStyle='rgba(255,210,74,.8)';
      ctx.beginPath();
      ctx.arc(t.x,t.y,b.r*(i/Math.max(1,b.trail.length))*0.9,0,Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha=1;

    // Ball
    const bg2=ctx.createRadialGradient(b.x-b.r/3,b.y-b.r/3,1,b.x,b.y,b.r);
    bg2.addColorStop(0,'#fff8e0');
    bg2.addColorStop(.5,'#ffd24a');
    bg2.addColorStop(1,'#ff8c00');
    ctx.fillStyle=bg2;
    ctx.shadowColor='#ffd24a';
    ctx.shadowBlur=20;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }

  requestAnimationFrame(drawBoard);
}

/* ============ BALL ANIMATION ============ */
function easeInQuad(t){return t*t}
function easeOutQuad(t){return t*(2-t)}

function animateBallTo(ball,x1,y1,x2,y2,dur){
  return new Promise(res=>{
    const start=performance.now();
    function step(now){
      const p=Math.min(1,(now-start)/dur);
      const e=easeOutQuad(p);
      ball.x=x1+(x2-x1)*e;
      ball.y=y1+(y2-y1)*e;
      ball.trail.push({x:ball.x,y:ball.y});
      if(ball.trail.length>8)ball.trail.shift();
      if(p<1) requestAnimationFrame(step);
      else res();
    }
    requestAnimationFrame(step);
  });
}

async function runBall(path){
  const topPad=H*0.08;
  const botPad=H*0.16;
  const usableH=H-topPad-botPad;
  const rowGap=usableH/S.rows;

  const pegR=Math.max(2.5,W*0.0065);
  const ballR=pegR*2.4;

  // Starting position: above the center top peg (row 0 has 3 pegs, center is index 1)
  const row0=pegs.filter(p=>p.row===0);
  const startPeg=row0[1];

  const ball={
    x:startPeg.x,
    y:topPad*0.4,
    r:ballR,
    trail:[]
  };
  balls.push(ball);

  // Drop to above the first peg
  await animateBallTo(ball,ball.x,ball.y,startPeg.x,startPeg.y-rowGap*0.5,180);

  let currentPos=1; // current peg index at current row

  for(let r=0;r<S.rows;r++){
    const dir=path[r]; // 'L' or 'R'
    const nextRow=r+1;

    // Current row pegs
    const curRowPegs=pegs.filter(p=>p.row===r);
    // Next row has one more peg
    let nextIdx;
    if(dir==='L'){
      nextIdx=currentPos;      // left child
    }else{
      nextIdx=currentPos+1;    // right child
    }

    // Get next peg position
    const nextRowPegs=pegs.filter(p=>p.row===nextRow);
    const nextPeg=nextRowPegs[nextIdx];
    if(!nextPeg) break;

    // Flash current peg
    const curPeg=curRowPegs[currentPos];
    if(curPeg) pegFlashes.set(r+'_'+curPeg.col,1);
    Aud.pegHit();

    // Animate to next peg
    await animateBallTo(ball,ball.x,ball.y,nextPeg.x,nextPeg.y-rowGap*0.45,Math.max(70,130-r*3));

    currentPos=nextIdx;
  }

  // Now drop to slot
  const slotIdx=currentPos;
  const slot=slots[Math.min(slotIdx,slots.length-1)];
  await animateBallTo(ball,ball.x,ball.y,slot.x,slot.y,220);

  Aud.land();

  // Remove ball
  const idx=balls.indexOf(ball);
  if(idx>=0) balls.splice(idx,1);

  return slotIdx;
}

/* ============ LOGIC ============ */
function updBal(){$('bal').textContent=Math.floor(S.bal).toLocaleString();const st=JSON.parse(localStorage.getItem('sc_user')||'{}');localStorage.setItem('sc_user',JSON.stringify({...st,balance:S.bal}))}
function updStats(){
  $('sBet').textContent=S.bet;
  $('betVal').textContent=S.bet;
  $('sRows').textContent=S.rows;
}

function showWinFloat(x,y,text,color){
  const el=document.createElement('div');
  el.id='winFloat';
  el.textContent=text;
  el.style.left=x+'px';
  el.style.top=y+'px';
  el.style.color=color;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1600);
}

async function drop(){
  if(S.dropping) return;
  if(S.bal<S.bet){toast('رصيد غير كافٍ',true);return}
  S.dropping=true;
  $('dropBtn').disabled=true;
  $('dropBtn').textContent='⏳ جاري الإسقاط...';
  Aud.ensure();Aud.dropSound();

  try{
    const res=await api('/api/plinko/drop',{method:'POST',body:JSON.stringify({bet:S.bet,risk:S.risk,rows:S.rows})});
    S.bal=res.balance;
    updBal();

    const finalSlot=await runBall(res.path);

    S.lastWin=res.win;
    $('sMult').textContent=res.multiplier+'×';
    $('sWin').textContent=Math.floor(res.win).toLocaleString();

    const slot=slots[Math.min(finalSlot,slots.length-1)];
    const col=colorForMult(res.multiplier)[0];

    if(res.win>0){
      if(res.multiplier>=4)Aud.bigWinSound();
      else Aud.winSound(Math.min(7,Math.ceil(res.multiplier+1)));
      showWinFloat(slot.x,slot.y-20,'+'+Math.floor(res.win).toLocaleString(),col);
      if(res.net>=0) toast('🎉 ربحت '+Math.floor(res.win).toLocaleString()+' ل.س (×'+res.multiplier+')');
      else toast('💸 خسرت '+Math.abs(res.net).toLocaleString()+' ل.س');
    } else {
      showWinFloat(slot.x,slot.y-20,'-'+S.bet,'#ff4a4a');
      toast('😢 لا فوز',true);
    }
  }catch(e){
    toast(e.message,true);
  }
  S.dropping=false;
  $('dropBtn').disabled=false;
  $('dropBtn').textContent='🎯 أسقط الكرة';
}

$('dropBtn').onclick=drop;

$('betDown').onclick=()=>{if(S.dropping)return;Aud.ensure();if(S.bi>0){S.bi--;S.bet=BETS[S.bi];updStats()}};
$('betUp').onclick=()=>{if(S.dropping)return;Aud.ensure();if(S.bi<BETS.length-1){S.bi++;S.bet=BETS[S.bi];updStats()}};

document.querySelectorAll('#riskRow .optBtn').forEach(b=>{
  b.onclick=()=>{
    if(S.dropping)return;
    Aud.ensure();
    document.querySelectorAll('#riskRow .optBtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    S.risk=b.dataset.r;
    buildBoard();
  };
});

document.querySelectorAll('#rowsRow .optBtn').forEach(b=>{
  b.onclick=()=>{
    if(S.dropping)return;
    Aud.ensure();
    document.querySelectorAll('#rowsRow .optBtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    S.rows=parseInt(b.dataset.n);
    updStats();
    buildBoard();
  };
});

$('homeBtn').onclick=()=>{if(S.dropping&&!confirm('الكرة في الهواء!'))return;location.href='/'};
$('soundBtn').onclick=()=>{const on=Aud.toggle();$('soundIcon').innerHTML='<use href="'+(on?'#ic-sound-on':'#ic-sound-off')+'"/>';if(on){Aud.init();Aud.resume();Aud.tone(600,.1,'sine',.15)}};

async function refreshMe(){try{const u=await api('/api/me');S.bal=u.balance;updBal()}catch(e){if(e.message.includes('جلسة')||e.message.includes('مصرح'))location.href='/'}}

/* ============ INIT ============ */
(async()=>{
  const token=localStorage.getItem('sc_token');
  if(!token){location.href='/';return}
  try{
    const u=await api('/api/me');
    S.bal=u.balance;updBal();
    resizeBoard();
    updStats();
    requestAnimationFrame(drawBoard);
  }catch(e){location.href='/'}
})();
</script>
